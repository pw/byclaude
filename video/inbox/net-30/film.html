<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: IS; src: url('../../motion/fonts/InstrumentSerif-Regular.ttf'); }
@font-face { font-family: ISI; src: url('../../motion/fonts/InstrumentSerif-Italic.ttf'); }
@font-face { font-family: Inter; src: url('../../motion/fonts/Inter.ttf'); font-weight: 100 900; }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../motion/common.js"></script>
<script src="../kit.js"></script>
<script>
// "net 30" — the fence contractor. The invoice sits pinned at the top; the day counter rolls; three polite
// follow-ups; the crew asks about Friday; one draft that says what he's actually thinking, deleted.
// Thursday night the money lands, and the first thing he does is tell the crew.
const ON_SCREEN = [
  "Rick · property manager", "Invoice #1047", "$3,720", "Net 30", "Sun 6:40 PM",
  "Day", "0", "30", "38", "45", "46",
  "6:40 PM", "7:12 AM", "6:55 AM", "9:48 PM", "9:52 PM", "10:26 PM",
  "Tue 7:12 AM", "Hi! Just a friendly reminder on invoice 1047.",
  "Wed 6:55 AM", "Circling back on invoice 1047 when you get a chance.",
  "Wed 9:48 PM", "Crew", "Payday Friday?", "yep",
  "Per my last three emails",
  "Following up on invoice 1047 ($3,720). Could you let me know when to expect it?",
  "Message", "Payment received · $3,720", "now",
  "Thu 10:26 PM", "We're good. See you at 7.",
  "@smallbusinessinbox", "A written composite. Not a real business or client."
];
const S = K.say(ON_SCREEN);
K.accent([206, 152, 84]);
const C = K.C, L = K.L;
const F = (w, s, fam = 'Inter') => `${w} ${s}px ${fam}`;
const eo = x => 1 - Math.pow(1 - clamp(x), 3);

// ---------- the client thread ----------
const A = K.conversation([
  { t: 3.7, stamp: S("Tue 7:12 AM") },
  { gap: 0.45, type: S("Hi! Just a friendly reminder on invoice 1047."), cps: 21 },
  { gap: 0.45, send: true },
  { gap: 3.0, stamp: S("Wed 6:55 AM") },
  { gap: 0.45, type: S("Circling back on invoice 1047 when you get a chance."), cps: 23 },
  { gap: 0.45, send: true },
  { gap: 3.0, stamp: S("Wed 9:48 PM") },
  { gap: 4.1, type: S("Per my last three emails"), cps: 14 },      // the crew asks during this gap
  { gap: 1.7, del: "all", cps: 22 },                                 // ...holds on it, then takes it back
  { gap: 0.6, type: S("Following up on invoice 1047 ($3,720). Could you let me know when to expect it?"), cps: 25 },
  { gap: 0.45, send: true },
]);
const RD = 1.6;                                       // a stretch of days, rolled on the counter
const R30 = 1.8, R38 = A.at[3] - 0.3 - RD, R45 = A.at[6] - 0.3 - RD;
const CREW = A.at[6] + 0.4, PAYDAY = CREW + 0.35, YEP = PAYDAY + 1.5, PEEK = YEP + 1.5;
const DRAFT = A.at[7], HOLD = DRAFT + 1.8, SEND3 = A.at[10];
const DIM = SEND3 + 1.3, DARK = DIM + 1.0, NIGHT = DARK + 0.35, ND = 1.8;
const BUZZ = NIGHT + ND + 0.2, OPEN = BUZZ + 2.2;

// ---------- the crew thread (the ending) ----------
const B = K.conversation([
  { t: -1, stamp: S("Wed 9:48 PM") },
  { t: -1, in: S("Payday Friday?") },
  { t: -1, out: S("yep") },
  { t: DARK + 0.5, stamp: S("Thu 10:26 PM") },
  { t: OPEN + 0.6, type: S("We're good. See you at 7."), cps: 19 },
  { gap: 0.45, send: true },
]);
const SENDC = B.at[5], CARD = SENDC + 1.7, TOTAL = CARD + 3.0;

const CLOCK = [[0, S("6:40 PM")], [R30, S("7:12 AM"), RD, 2], [R38, S("6:55 AM"), RD, 2], [R45, S("9:48 PM"), RD, 1],
  [SEND3 + 0.9, S("9:52 PM"), 0.5], [NIGHT, S("10:26 PM"), ND, 6]];
const DAYS = [[0, S("0")], [R30, S("30"), RD, 1], [R38, S("38"), RD], [R45, S("45"), RD], [NIGHT, S("46"), ND]];
function track(tr, t) {
  let st = { from: tr[0][1], to: tr[0][1], p: 1, spin: 0 };
  for (let i = 1; i < tr.length; i++) {
    const [t0, s, dur = 0.5, spin = 0] = tr[i]; if (t < t0) break;
    st = { from: tr[i - 1][1], to: s, p: clamp((t - t0) / dur), spin };
  }
  return st;
}
// how overdue it feels: nothing until the due date, a little on Day 30, all of it by Day 38
const late = t => (0.3 * ss(R30, R30 + RD, t) + 0.7 * ss(R38, R38 + RD, t)) * (1 - ss(BUZZ + 0.4, BUZZ + 1.6, t));  // paid: it lets go

// ---------- pieces this film needs that the kit lacks ----------
function dayPill(t, a) {
  if (a <= 0) return;
  g.font = F(600, 34); const dw = g.measureText('0').width, st = track(DAYS, t);
  const k = late(t), w = 72 + g.measureText(S("Day")).width + dw * lerp(st.from.length, st.to.length, ss(0, 1, st.p)), h = 62, x = L.x1 - w, y = L.headerY - h / 2;
  g.fillStyle = rgba(mix(C.raise, C.accent, k), a); g.beginPath(); g.roundRect(x, y, w, h, 31); g.fill();
  const ink = rgba(mix(C.ink, C.bg, ss(0.5, 0.62, k)), 1);   // flips fast so the number never sinks into the pill
  g.globalAlpha = a; g.font = F(600, 34); g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = ink;
  g.fillText(S("Day"), x + 30, L.headerY + 1);
  K.rollText(st.from, st.to, st.p, x + 30 + g.measureText(S("Day")).width + 12, L.headerY + 1, 34, ink, 'left', st.spin);
  g.globalAlpha = 1;
}
const CARD_H = 326, cardY = t => lerp(720, 346, ss(R30 - 0.2, R30 + RD, t));   // pinned once the waiting starts
function invoiceCard(t, a) {
  const x0 = L.x0, x1 = L.x1, y = cardY(t), k = late(t);
  g.fillStyle = rgba(C.raise, a); g.strokeStyle = rgba(C.line, a); g.lineWidth = 2;
  g.beginPath(); g.roundRect(x0, y, x1 - x0, CARD_H, 40); g.fill(); g.stroke();
  // a drawn document: page with a folded corner and three rules
  const dx = x0 + 40, dy = y + 38;
  g.strokeStyle = rgba(C.accent, a); g.lineWidth = 3.5; g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath(); g.moveTo(dx, dy); g.lineTo(dx + 28, dy); g.lineTo(dx + 42, dy + 14); g.lineTo(dx + 42, dy + 54);
  g.lineTo(dx, dy + 54); g.closePath(); g.stroke();
  g.beginPath(); g.moveTo(dx + 28, dy); g.lineTo(dx + 28, dy + 14); g.lineTo(dx + 42, dy + 14); g.stroke();
  for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(dx + 9, dy + 26 + i * 9); g.lineTo(dx + 33 - (i === 2 ? 10 : 0), dy + 26 + i * 9); g.stroke(); }
  g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillStyle = rgba(C.ink, a); g.font = F(600, 42); g.fillText(S("Invoice #1047"), dx + 70, dy + 28);
  g.fillStyle = rgba(C.dim, a); g.font = F(400, 30); g.textAlign = 'right'; g.fillText(S("Sun 6:40 PM"), x1 - 40, dy + 28);
  g.fillStyle = rgba(C.line, a); g.fillRect(x0 + 40, y + 124, x1 - x0 - 80, 2);
  g.textAlign = 'left'; g.fillStyle = rgba(C.ink, a); g.font = F(400, 132, 'IS'); g.fillText(S("$3,720"), x0 + 36, y + 212);
  g.font = F(600, 40); g.fillStyle = rgba(mix(C.dim, C.accent, k), a); g.textAlign = 'right'; g.fillText(S("Net 30"), x1 - 40, y + 224);
}
// the crew group, surfacing low in the frame above the compose box
const layPay = () => K.layout(S("Payday Friday?")), layYep = () => K.layout(S("yep"));
let LP, LY;
function crewH(t) {
  const rise = eo((t - CREW) / 0.5); if (rise <= 0) return 0;
  const full = 208 + 112 * eo((t - YEP) / 0.34), pk = ss(PEEK, PEEK + 0.6, t);
  return lerp(full, 90, pk) * rise;
}
function crewPanel(t, bottom, a) {
  const h = crewH(t); if (h < 1 || a <= 0) return;
  const top = bottom - h, x0 = L.x0, x1 = L.x1, pk = ss(PEEK, PEEK + 0.6, t);
  g.save(); g.beginPath(); g.roundRect(x0, top, x1 - x0, h, 40); g.clip();
  g.fillStyle = rgba(mix(C.bg, C.raise, 0.75), a); g.fillRect(x0, top, x1 - x0, h);
  // header row: two heads (the group), the name, and — once folded — the last thing said
  const hy = top + 45;
  g.fillStyle = rgba(mix(C.raise, C.accent, 0.35), a); g.beginPath(); g.arc(x0 + 58, hy, 17, 0, 6.29); g.fill();
  g.strokeStyle = rgba(mix(C.bg, C.raise, 0.75), a); g.lineWidth = 4;
  g.fillStyle = rgba(mix(C.raise, C.accent, 0.55), a); g.beginPath(); g.arc(x0 + 80, hy + 4, 17, 0, 6.29); g.fill(); g.stroke();
  g.fillStyle = rgba(C.ink, 0.9 * a); g.font = F(600, 34); g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(S("Crew"), x0 + 116, hy + 1);
  if (pk > 0) { g.fillStyle = rgba(C.dim, a * pk); g.font = F(400, 36); g.textAlign = 'right'; g.fillText(S("yep"), x1 - 40, hy + 1); }
  const fa = a * (1 - pk) * 0.94;
  if (fa > 0) {
    const p1 = eo((t - PAYDAY) / 0.34), p2 = eo((t - YEP) / 0.34);
    if (p1 > 0) K.bubble('in', LP, x0 + 24 - (1 - p1) * 30, top + 86 + (1 - p1) * 24, fa * p1, true);
    if (p2 > 0) K.bubble('out', LY, x1 - 24, top + 86 + 112 + (1 - p2) * 30, fa * p2, true);
  }
  g.restore();
  g.strokeStyle = rgba(C.line, a); g.lineWidth = 2; g.beginPath(); g.roundRect(x0, top, x1 - x0, h, 40); g.stroke();
}

window.render = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.textBaseline = 'middle';
  if (!LP) { LP = layPay(); LY = layYep(); }
  K.ground();
  const lock = ss(DARK - 0.4, DARK + 0.3, t) * (1 - ss(OPEN - 0.3, OPEN + 0.1, t));
  if (t < DARK + 0.4) {
    K.header({ name: S("Rick · property manager") });
    const ch = crewH(t), lift = ch > 0 ? ch + 26 * eo((t - CREW) / 0.5) : 0;
    const cb = cardY(t) + CARD_H, r = A.draw(t, { placeholder: S("Message"), scroll: -lift, top: cb + 16 });
    const mk = g.createLinearGradient(0, cb, 0, cb + 110); mk.addColorStop(0, rgba(C.bg, 1)); mk.addColorStop(0.5, rgba(C.bg, 1)); mk.addColorStop(1, rgba(C.bg, 0));
    g.fillStyle = mk; g.fillRect(0, cb, W, 110);   // older bubbles slip under the pinned invoice, not beside it
    invoiceCard(t, 1);
    crewPanel(t, r.composerTop - 22, 1);
  } else {
    K.header({ name: S("Crew") });
    B.draw(t, { placeholder: S("Message"), cursorFrom: OPEN + 0.2 });
  }
  dayPill(t, 1 - 0.6 * lock);
  const dimA = 0.5 * ss(DIM, DIM + 0.6, t) * (1 - ss(OPEN - 0.3, OPEN, t));
  if (dimA > 0) { g.fillStyle = `rgba(0,0,0,${dimA})`; g.fillRect(0, 0, W, H); }
  if (lock > 0) {
    K.ground(lock, [8, 7, 6]);
    K.bigClock(t, CLOCK, { y: 560, size: 210, alpha: lock * ss(DARK + 0.1, DARK + 0.5, t) });
    K.banner(t, { t0: BUZZ, t1: OPEN - 0.3, name: S("Invoice #1047"), text: S("Payment received · $3,720"), label: S("now"), y: 780, alpha: lock });
    dayPill(t, lock * 0.75);
  }
  K.statusBar(t, { clock: CLOCK, battery: t => t < NIGHT ? lerp(0.78, 0.24, clamp(t / DIM)) : lerp(0.24, 0.9, ss(NIGHT, NIGHT + ND, t)),
                   alpha: 1 - 0.5 * lock * (1 - ss(NIGHT, NIGHT + ND, t)) });
  vignette(0.35);
  K.endCard(t, CARD, { handle: S("@smallbusinessinbox"), note: S("A written composite. Not a real business or client.") });
  grain(t);
};
window.ready = (async () => {
  await K.ready();
  const ticks = (t0, dur, n, gain) => Array.from({ length: n }, (_, i) => ({ t: t0 + dur * (i / n) ** 1.3, k: 'tick', gain: gain * (1 - 0.5 * i / n) }));
  const events = A.events.concat(B.events,
    ticks(R30, RD, 12, 0.5), ticks(R38, RD, 7, 0.5), ticks(R45, RD, 7, 0.5), ticks(NIGHT, ND, 5, 0.35),
    [{ t: PAYDAY, k: 'notif', gain: 0.7 }, { t: YEP, k: 'send', gain: 0.8 }, { t: BUZZ, k: 'buzz' }, { t: OPEN - 0.25, k: 'click' },
     { t: SENDC + 0.05, k: 'bell', gain: 0.6 }]);
  return { total: TOTAL, events,
    tension: [[0, 0.08], [R30, 0.15], [A.at[2], 0.28], [R38 + RD, 0.38], [A.at[5], 0.42], [R45 + RD, 0.52], [PAYDAY, 0.62],
              [DRAFT, 0.7], [HOLD, 0.82], [A.at[9], 0.66], [SEND3, 0.6], [DARK, 0.5], [BUZZ, 0.18], [OPEN + 1, 0.05], [TOTAL, 0]],
    warm: [[BUZZ, 0], [BUZZ + 0.8, 0.28], [SENDC, 0.34], [SENDC + 0.6, 0.4], [CARD + 0.5, 0.25], [TOTAL, 0.1]] };
})();
</script></body></html>
