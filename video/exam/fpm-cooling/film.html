<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Anton; src: url('../fonts/Anton-Regular.ttf'); }
@font-face { font-family: Inter; src: url('../../motion/fonts/Inter.ttf'); font-weight: 100 900; }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../motion/common.js"></script>
<script src="../kit.js"></script>
<script>
// fpm-cooling — two-stage cooling of cooked TCS food (Food Code 3-501.14(A), same in 2022 and 2026).
// Chili at 135°F at 2:00 PM: 70°F by 4:00 PM, 41°F by 8:00 PM (6 hours TOTAL from 135°F). Answer B.
const ON_SCREEN = [
  "FOOD MANAGER EXAM", "CAN YOU TIME THIS ONE?", "PRACTICE QUESTION", "example",
  "Cooked chili is being cooled. It is at 135°F at 2:00 PM. Using the Food Code cooling time limits, by when must it reach 70°F, and by when 41°F or less?",
  "A) 4:00 PM, then 6:00 PM", "B) 4:00 PM, then 8:00 PM", "C) 4:00 PM, then 10:00 PM", "D) 6:00 PM, then 8:00 PM",
  "PAUSE AND SOLVE IT", "5", "4", "3", "2", "1",
  "135°F", "70°F", "41°F", "2:00 PM", "4:00 PM", "8:00 PM", "6 HOURS TOTAL",
  "135°F TO 70°F", "135°F TO 41°F", "stage 1", "stage 2",
  "2:00 PM + 2 h", "2:00 PM + 6 h", "=",
  "FOOD CODE 3-501.14(A)",
  "THE TRAP", "C) 10:00 PM restarts the clock at 70°F. The 6 hours start at 135°F.",
  "@fpmexamprep", "A free practice question every morning in our group.", "Join from this Page.",
  "Unofficial. Not affiliated with any exam provider or regulator.", "Based on the FDA Food Code; your local code may differ."
];
const S = EX.init(ON_SCREEN, 'fpm'), T = EX.T;
const Q = S("Cooked chili is being cooled. It is at 135°F at 2:00 PM. Using the Food Code cooling time limits, by when must it reach 70°F, and by when 41°F or less?");
const OPTS = [S("A) 4:00 PM, then 6:00 PM"), S("B) 4:00 PM, then 8:00 PM"), S("C) 4:00 PM, then 10:00 PM"), S("D) 6:00 PM, then 8:00 PM")], ANSWER = 'B';
const TRAP = S("C) 10:00 PM restarts the clock at 70°F. The 6 hours start at 135°F.");
const CITE = S("FOOD CODE 3-501.14(A)");

const PLAN = EX.schedule([
  { id: 'hook', kind: 'hook', read: [S("FOOD MANAGER EXAM"), S("CAN YOU TIME THIS ONE?")], in: 0.6, min: 2.2 },
  { id: 'q', kind: 'question', read: [S("PRACTICE QUESTION"), S("example"), Q], in: 0.9, gap: 0.1 },
  ...OPTS.map((s, i) => ({ id: 'o' + i, kind: 'option', read: [s], in: 0.4, min: 0.75 })),
  { id: 'pause', kind: 'pause', read: [S("PAUSE AND SOLVE IT")], in: 0.3, min: 5 },
  { id: 'reveal', kind: 'reveal', in: 0.4, min: 1.3 },
  { id: 's1', kind: 'work', read: [S("135°F"), S("70°F"),        // timeline times repeat the ledger's numbers: counted once
      S("135°F TO 70°F"), S("stage 1"), S("2:00 PM + 2 h"), S("="), S("4:00 PM")], in: 1.2 },
  { id: 's2', kind: 'work', read: [S("41°F"), S("6 HOURS TOTAL"),
      S("135°F TO 41°F"), S("stage 2"), S("2:00 PM + 6 h"), S("="), S("8:00 PM")], in: 1.2 },
  { id: 'cite', kind: 'work', read: [CITE], in: 0.5, min: 1.4 },
  { id: 'trap', kind: 'trap', read: [S("THE TRAP"), TRAP], in: 0.5 },
  { id: 'end', kind: 'end', in: 0.6, min: 4.0 },
], { start: 0.2 });
const A = PLAN.at, TOTAL = PLAN.total, RV = A.reveal.at;

// ---------- layout ----------
const CARD_Y = 285, BANNER_Y = 330;
const TL_Y = 560, TL_X0 = 160, TL_X1 = 920, HR = (TL_X1 - TL_X0) / 6;   // 2:00 PM .. 8:00 PM, px per hour
const LED_Y = 790, CITE_Y = 1225, TRAP_Y = 1305;
let OPT_Y = 0;

// the timeline: a bar from 2:00 PM to 8:00 PM, stage 1 drawn first (2 h), then the rest of the 6 hours
function capsText(s, x, y, a, size = 36, color = T.dim, align = 'center') {
  g.font = EX.F(400, size, 'Anton'); if ('letterSpacing' in g) g.letterSpacing = '4px';
  g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = rgba(color, a); g.fillText(S(s), x, y);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}
function marker(t, t0, x, temp, time, a) {
  const p = EX.eo((t - t0) / 0.45); if (p <= 0) return;
  g.fillStyle = rgba(T.ground, a * p); g.beginPath(); g.arc(x, TL_Y, 17, 0, 6.2832); g.fill();
  g.strokeStyle = rgba(T.text, a * p); g.lineWidth = 6; g.beginPath(); g.arc(x, TL_Y, 17, 0, 6.2832); g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = EX.F(400, 66, 'Anton'); g.fillStyle = rgba(T.text, a * p); g.fillText(S(temp), x, TL_Y - 78 + (1 - p) * 12);
  EX.num(S(time), x, TL_Y + 60 + (1 - p) * 8, 44, 'center', rgba(T.dim, a * p), 600);
}
function bracket(t, t0, xa, xb, y, label, a) {
  const p = EX.eo((t - t0) / 0.6); if (p <= 0) return;
  const xe = lerp(xa, xb, p);
  g.strokeStyle = rgba(T.dim, 0.85 * a); g.lineWidth = 3; g.lineCap = 'round';
  g.beginPath(); g.moveTo(xa, y - 14); g.lineTo(xa, y); g.lineTo(xe, y); if (p > 0.98) g.lineTo(xb, y - 14); g.stroke();
  capsText(label, (xa + xb) / 2, y + 34, a * ss(0.5, 1, p), 34);
}
function timeline(t) {
  const t1 = A.s1.at, t2 = A.s2.at;
  if (t < t1) return;
  const a = 1 - 0.55 * ss(A.trap.at, A.trap.at + 0.6, t);
  g.fillStyle = rgba(T.line, a * ss(t1, t1 + 0.4, t)); g.fillRect(TL_X0, TL_Y - 5, TL_X1 - TL_X0, 10);
  const p1 = EX.eo((t - t1 - 0.35) / 0.9), xs1 = TL_X0 + 2 * HR;
  if (p1 > 0) { g.fillStyle = rgba(T.text, a); g.fillRect(TL_X0, TL_Y - 7, (xs1 - TL_X0) * p1, 14); }
  const p2 = EX.eo((t - t2 - 0.35) / 1.1);
  if (p2 > 0) { g.fillStyle = rgba(T.dim, a); g.fillRect(xs1, TL_Y - 7, (TL_X1 - xs1) * p2, 14); }
  marker(t, t1, TL_X0, "135°F", "2:00 PM", a);
  marker(t, t1 + 1.1, xs1, "70°F", "4:00 PM", a);
  if (t >= t2) marker(t, t2 + 1.3, TL_X1, "41°F", "8:00 PM", a);
  bracket(t, t2 + 0.3, TL_X0, TL_X1, TL_Y + 120, "6 HOURS TOTAL", a);
}
const ROWS = [
  { head: S("135°F TO 70°F"), at: A.s1.at + 1.6 },
  { at: A.s1.at + 1.9, label: S("stage 1"), from: S("2:00 PM + 2 h"), op: S("="), to: S("4:00 PM") },
  { head: S("135°F TO 41°F"), at: A.s2.at + 1.6 },
  { at: A.s2.at + 1.9, label: S("stage 2"), from: S("2:00 PM + 6 h"), op: S("="), to: S("8:00 PM"), strong: true },
];
function cite(t) {
  const p = EX.eo((t - A.cite.at) / 0.5); if (p <= 0) return;
  g.fillStyle = rgba(T.dim, p); g.fillRect(80, CITE_Y - 22, 5, 44);
  capsText(CITE, 104, CITE_Y + 2, p, 42, T.dim, 'left');
}

window.render = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.textBaseline = 'middle';
  EX.ground();
  const rg = g.createRadialGradient(CX, 300, 50, CX, 300, 1300);
  rg.addColorStop(0, 'rgba(255,245,220,0.06)'); rg.addColorStop(1, 'rgba(255,245,220,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);

  EX.hook(t, A.hook.at, A.hook.end, [S("FOOD MANAGER EXAM"), S("CAN YOU TIME THIS ONE?")], { y: 900 });
  EX.kicker(t, S("PRACTICE QUESTION"), { alpha: ss(A.q.at, A.q.at + 0.6, t) });

  const leave = ss(RV + 1.0, RV + 1.8, t);
  const bottom = EX.card(t, A.q.at, Q, { y: CARD_Y, tag: S("example"), alpha: 1 - leave, dy: -40 * leave });
  OPT_Y = bottom + 36;
  const rowH = 100, gap = 18;
  if (leave < 1) EX.options(t, OPTS, { y: OPT_Y, rowH, gap, at: [A.o0.at, A.o1.at, A.o2.at, A.o3.at], reveal: RV, answer: ANSWER, alpha: 1 - leave, hide: t >= RV + 1.0 ? ANSWER : null });
  const ansI = OPTS.findIndex(s => s[0] === ANSWER);
  if (t >= RV + 1.0) {
    const m = ss(RV + 1.0, RV + 1.9, t), y = lerp(OPT_Y + ansI * (rowH + gap) + rowH / 2, BANNER_Y, m);
    EX.optionRow(t, OPTS[ansI], 60, y, 960, rowH, { arrive: 1, lit: 1, alpha: 1 - ss(A.end.at, A.end.at + 0.6, t) });
  }
  EX.ring(t, A.pause.shown, 5, { x: 150, y: OPT_Y + 4 * (rowH + gap) + 92, r: 64, label: S("PAUSE AND SOLVE IT"), labelSize: 60, labelX: 254 });

  timeline(t);
  const dimW = 1 - 0.4 * ss(A.trap.at, A.trap.at + 0.6, t);
  EX.ledger(t, ROWS, { y: LED_Y, x0: 80, xFrom: 610, xOp: 650, xTo: 1000, rowH: 100, size: 64, strongSize: 76, alpha: dimW });
  cite(t);
  EX.trap(t, A.trap.at, TOTAL + 1, S("THE TRAP"), TRAP, { y: TRAP_Y, size: 46 });

  vignette(0.22);
  EX.endCard(t, A.end.at);
  grain(t);
};
window.ready = (async () => {
  await EX.ready();
  return { total: TOTAL, events: PLAN.events, tension: PLAN.tension, warm: PLAN.warm,
           beats: PLAN.beats.map(b => [b.id, +b.at.toFixed(2), +b.end.toFixed(2)]) };
})();
</script></body></html>
