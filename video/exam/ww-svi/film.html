<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Anton; src: url('../fonts/Anton-Regular.ttf'); }
@font-face { font-family: Inter; src: url('../../motion/fonts/Inter.ttf'); font-weight: 100 900; }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../motion/common.js"></script>
<script src="../kit.js"></script>
<script>
// ww-svi — sludge volume index from a 30-minute settleometer reading: 250 mL/L settled, MLSS 2,000 mg/L.
// SVI = SSV30 x 1,000 / MLSS = 125 mL/g. Trap: flipping the ratio (2,000 / 250 = 8).
const ON_SCREEN = [
  "WASTEWATER EXAM MATH", "CAN YOU GET THIS ONE?", "PRACTICE QUESTION", "example",
  "Activated sludge settleometer test: after 30 minutes the settled sludge volume is 250 mL/L. The MLSS is 2,000 mg/L. What is the sludge volume index (SVI)?",
  "A) 0.125 mL/g", "B) 8 mL/g", "C) 125 mL/g", "D) 8,000 mL/g",
  "PAUSE AND SOLVE IT", "5", "4", "3", "2", "1",
  "THE FORMULA", "SVI = SSV30 × 1,000 ÷ MLSS",
  "settled, 30 min", "mL/L", "250", "mg to g", "×", "1,000", "250,000", "MLSS", "mg/L", "÷", "2,000",
  "SVI", "mL/g", "=", "125",
  "Each gram of sludge settles into 125 mL.",
  "THE TRAP", "B) 8 mL/g flips the ratio: settled volume goes on top, MLSS on the bottom.",
  "@wastewaterexamprep", "A free practice question every morning in our group.", "Join from this Page.",
  "Unofficial. Not affiliated with any exam provider or regulator.", "Check your state's exam and formula sheet."
];
const S = EX.init(ON_SCREEN, 'ww'), T = EX.T;
const Q = S("Activated sludge settleometer test: after 30 minutes the settled sludge volume is 250 mL/L. The MLSS is 2,000 mg/L. What is the sludge volume index (SVI)?");
const OPTS = [S("A) 0.125 mL/g"), S("B) 8 mL/g"), S("C) 125 mL/g"), S("D) 8,000 mL/g")], ANSWER = 'C';
const TRAP = S("B) 8 mL/g flips the ratio: settled volume goes on top, MLSS on the bottom.");
const FORMULA = S("SVI = SSV30 × 1,000 ÷ MLSS"), MEANING = S("Each gram of sludge settles into 125 mL.");

const PLAN = EX.schedule([
  { id: 'hook', kind: 'hook', read: [S("WASTEWATER EXAM MATH"), S("CAN YOU GET THIS ONE?")], in: 0.6, min: 2.2 },
  { id: 'q', kind: 'question', read: [S("PRACTICE QUESTION"), S("example"), Q], in: 0.9, gap: 0.3 },
  ...OPTS.map((s, i) => ({ id: 'o' + i, kind: 'option', read: [s], in: 0.4, min: 0.75 })),
  { id: 'pause', kind: 'pause', read: [S("PAUSE AND SOLVE IT")], in: 0.3, min: 5 },
  { id: 'reveal', kind: 'reveal', in: 0.4, min: 1.3 },
  { id: 'f', kind: 'work', read: [S("THE FORMULA"), FORMULA], in: 0.8 },
  { id: 'w1', kind: 'work', read: [S("settled, 30 min"), S("mL/L"), S("250")], in: 0.8 },
  { id: 'w2', kind: 'work', read: [S("mg to g"), S("×"), S("1,000"), S("250,000")], in: 1.0 },
  { id: 'w3', kind: 'work', read: [S("MLSS"), S("mg/L"), S("÷"), S("2,000")], in: 0.8 },
  { id: 'w4', kind: 'work', read: [S("SVI"), S("mL/g"), S("="), S("125")], in: 0.8, min: 1.5 },
  { id: 'mean', kind: 'work', read: [MEANING], in: 0.6 },
  { id: 'trap', kind: 'trap', read: [S("THE TRAP"), TRAP], in: 0.5 },
  { id: 'end', kind: 'end', in: 0.6, min: 4.0 },
], { start: 0.2 });
const A = PLAN.at, TOTAL = PLAN.total, RV = A.reveal.at;

// ---------- layout ----------
const CARD_Y = 285, BANNER_Y = 330, F_Y = 530, LED_Y = 610;
const ROWS = [
  { at: A.w1.at, label: S("settled, 30 min"), note: S("mL/L"), to: S("250") },
  { at: A.w2.at, label: S("mg to g"), op: S("×"), to: S("1,000") },
  { rule: true, at: A.w2.at + 0.4 },
  { at: A.w2.at + 0.55, to: S("250,000") },
  { at: A.w3.at, label: S("MLSS"), note: S("mg/L"), op: S("÷"), to: S("2,000") },
  { rule: true, at: A.w4.at },
  { at: A.w4.at + 0.2, label: S("SVI"), note: S("mL/g"), op: S("="), to: S("125"), strong: true },
];

function formula(t) {
  const t0 = A.f.at; if (t < t0) return;
  g.textBaseline = 'middle';
  g.font = EX.F(400, 38, 'Anton'); if ('letterSpacing' in g) g.letterSpacing = '5px';
  g.textAlign = 'left'; g.fillStyle = rgba(T.dim, EX.eo((t - t0) / 0.4)); g.fillText(S("THE FORMULA"), 80, F_Y - 58);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  EX.line(t, t0 + 0.25, FORMULA, 80, F_Y + 6, { size: 58, weight: 600, dur: 0.7 });
  // hairline under the formula so it reads as the heading of the arithmetic below
  const p = EX.eo((t - t0 - 0.9) / 0.5); if (p > 0) { g.fillStyle = rgba(T.line, 1); g.fillRect(80, F_Y + 62, 920 * p, 3); }
}

window.render = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.textBaseline = 'middle';
  EX.ground();
  const rg = g.createRadialGradient(CX, 300, 50, CX, 300, 1300);
  rg.addColorStop(0, 'rgba(200,225,245,0.07)'); rg.addColorStop(1, 'rgba(200,225,245,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);

  EX.hook(t, A.hook.at, A.hook.end, [S("WASTEWATER EXAM MATH"), S("CAN YOU GET THIS ONE?")], { y: 900 });
  EX.kicker(t, S("PRACTICE QUESTION"), { alpha: ss(A.q.at, A.q.at + 0.6, t) });

  const leave = ss(RV + 1.0, RV + 1.8, t);
  const bottom = EX.card(t, A.q.at, Q, { y: CARD_Y, tag: S("example"), alpha: 1 - leave, dy: -40 * leave });
  const OPT_Y = bottom + 36, rowH = 100, gap = 18;
  if (leave < 1) EX.options(t, OPTS, { y: OPT_Y, rowH, gap, at: [A.o0.at, A.o1.at, A.o2.at, A.o3.at], reveal: RV, answer: ANSWER, alpha: 1 - leave, hide: t >= RV + 1.0 ? ANSWER : null });
  const ansI = OPTS.findIndex(s => s[0] === ANSWER);
  if (t >= RV + 1.0) {                            // the lit answer row rises to become the banner
    const m = ss(RV + 1.0, RV + 1.9, t), y = lerp(OPT_Y + ansI * (rowH + gap) + rowH / 2, BANNER_Y, m);
    EX.optionRow(t, OPTS[ansI], 60, y, 960, rowH, { arrive: 1, lit: 1, alpha: 1 - ss(A.end.at, A.end.at + 0.6, t) });
  }
  EX.ring(t, A.pause.shown, 5, { x: 150, y: OPT_Y + 4 * (rowH + gap) + 92, r: 64, label: S("PAUSE AND SOLVE IT"), labelSize: 60, labelX: 254 });

  // worked answer
  formula(t);
  const ledBottom = EX.ledger(t, ROWS, { y: LED_Y, x0: 80, xFrom: 560, xOp: 700, xTo: 1000, rowH: 94, size: 64, strongSize: 110 });
  const mp = EX.eo((t - A.mean.at) / 0.6);
  if (mp > 0) EX.line(t, A.mean.at, MEANING, 80, ledBottom + 40, { size: 50, weight: 500, color: T.text, dur: 0.7 });
  EX.trap(t, A.trap.at, TOTAL + 1, S("THE TRAP"), TRAP, { y: ledBottom + 110, size: 46 });

  vignette(0.22);
  EX.endCard(t, A.end.at);
  grain(t);
};
window.ready = (async () => {
  await EX.ready();
  return { total: TOTAL, events: PLAN.events, tension: PLAN.tension, warm: PLAN.warm,
           beats: PLAN.beats.map(b => [b.id, +b.at.toFixed(2), +b.end.toFixed(2)]) };
})();
</script></body></html>
