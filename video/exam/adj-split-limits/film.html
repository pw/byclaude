<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Anton; src: url('../fonts/Anton-Regular.ttf'); }
@font-face { font-family: Inter; src: url('../../motion/fonts/Inter.ttf'); font-weight: 100 900; }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../motion/common.js"></script>
<script src="../kit.js"></script>
<script>
// adj-split-limits — auto liability split limits (example 25/50/25). Three injured people, one of them over the
// each-person cap, the injuries together over the each-accident cap, property over its cap. Answer: $75,000.
const ON_SCREEN = [
  "ADJUSTER EXAM MATH", "CAN YOU GET THIS ONE?", "PRACTICE QUESTION", "example",
  "Auto liability limits: 25/50/25. Your insured is fully liable for a crash. Three injured people: $30,000, $20,000 and $10,000 in damages. Damage to the other cars: $28,000. What is the most the liability coverage pays for these damages?",
  "A) $50,000", "B) $75,000", "C) $78,000", "D) $80,000",
  "PAUSE AND SOLVE IT", "5", "4", "3", "2", "1",
  "THE LIMITS", "25", "50", "INJURY", "each person", "each accident",
  "INJURIES", "person 1", "person 2", "person 3", "each-person cap", "30,000", "25,000", "20,000", "10,000", "+",
  "injuries", "each-accident cap", "55,000", "50,000",
  "PROPERTY", "other cars", "28,000",
  "total", "=", "75,000",
  "THE TRAP", "D) $80,000 forgets the each-accident cap: injuries together max out at $50,000.",
  "@adjusterexamprep", "A free practice question every morning in our group.", "Join from this Page.",
  "Unofficial. Not affiliated with any exam provider or regulator.", "Rules vary by state."
];
const S = EX.init(ON_SCREEN, 'adj'), T = EX.T;
const Q = S("Auto liability limits: 25/50/25. Your insured is fully liable for a crash. Three injured people: $30,000, $20,000 and $10,000 in damages. Damage to the other cars: $28,000. What is the most the liability coverage pays for these damages?");
const OPTS = [S("A) $50,000"), S("B) $75,000"), S("C) $78,000"), S("D) $80,000")], ANSWER = 'B';
const TRAP = S("D) $80,000 forgets the each-accident cap: injuries together max out at $50,000.");
const LEGEND = [[S("25"), S("each person")], [S("50"), S("each accident")], [S("25"), null]];

const PLAN = EX.schedule([
  { id: 'hook', kind: 'hook', read: [S("ADJUSTER EXAM MATH"), S("CAN YOU GET THIS ONE?")], in: 0.6, min: 2.2 },
  { id: 'q', kind: 'question', read: [S("PRACTICE QUESTION"), S("example"), Q], in: 0.9, gap: 0.3 },
  ...OPTS.map((s, i) => ({ id: 'o' + i, kind: 'option', read: [s], in: 0.4, min: 0.75 })),
  { id: 'pause', kind: 'pause', read: [S("PAUSE AND SOLVE IT")], in: 0.3, min: 5 },
  { id: 'reveal', kind: 'reveal', in: 0.4, min: 1.3 },
  { id: 'legend', kind: 'work', read: [S("THE LIMITS"), S("25"), S("50"), S("25"), S("INJURY"), S("each person"), S("each accident"), S("PROPERTY")], in: 0.8 },
  { id: 'w1', kind: 'work', read: [S("INJURIES"), S("person 1"), S("each-person cap"), S("30,000"), S("25,000")], in: 1.0 },
  { id: 'w2', kind: 'work', read: [S("person 2"), S("20,000"), S("person 3"), S("+"), S("10,000")], in: 0.7 },
  { id: 'w4', kind: 'work', read: [S("injuries"), S("each-accident cap"), S("55,000"), S("50,000")], in: 1.0 },
  { id: 'w5', kind: 'work', read: [S("PROPERTY"), S("other cars"), S("28,000"), S("25,000")], in: 1.0 },
  { id: 'w6', kind: 'work', read: [S("total"), S("="), S("75,000")], in: 0.8, min: 1.5 },
  { id: 'trap', kind: 'trap', read: [S("THE TRAP"), TRAP], in: 0.5 },
  { id: 'end', kind: 'end', in: 0.6, min: 4.0 },
], { start: 0.2 });
const A = PLAN.at, TOTAL = PLAN.total, RV = A.reveal.at;

// ---------- layout ----------
const CARD_Y = 285;
let OPT_Y = 0;                                   // set from the card's height on first render
const BANNER_Y = 330, LEG_Y = 500, LED_Y = 740;

function legend(t) {
  const t0 = A.legend.at, a = 1 - EX.eo((t - A.trap.at) / 0.5);
  if (t < t0 || a <= 0) return;
  const cap = (txt, x, y, al, align = 'center') => { g.font = EX.F(400, 36, 'Anton'); if ('letterSpacing' in g) g.letterSpacing = '5px';
    g.textAlign = align; g.fillStyle = rgba(T.dim, al); g.fillText(txt, x, y); if ('letterSpacing' in g) g.letterSpacing = '0px'; };
  g.textBaseline = 'middle';
  cap(S("THE LIMITS"), 80, LEG_Y - 70, a * EX.eo((t - t0) / 0.4), 'left');
  LEGEND.forEach(([n, e], i) => {
    const p = EX.eo((t - t0 - 0.2 - i * 0.25) / 0.5); if (p <= 0) return;
    const x = 240 + i * 300, y = LEG_Y + (1 - p) * 16;
    g.textAlign = 'center'; g.font = EX.F(400, 120, 'Anton'); g.fillStyle = rgba(T.text, a * p); g.fillText(n, x, y + 34);
    if (i < 2) { g.strokeStyle = rgba(T.dim, 0.7 * a * p); g.lineWidth = 6; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x + 164, y - 16); g.lineTo(x + 136, y + 84); g.stroke(); }
    if (e) { g.font = EX.F(500, 38); g.fillStyle = rgba(T.text, 0.9 * a * p); g.fillText(e, x, y + 126); }
  });
  // INJURY brackets the first two numbers; PROPERTY sits under the third
  const q = EX.eo((t - t0 - 0.8) / 0.5); if (q <= 0) return;
  g.strokeStyle = rgba(T.dim, 0.8 * a * q); g.lineWidth = 3;
  g.beginPath(); g.moveTo(110, LEG_Y + 160); g.lineTo(110, LEG_Y + 174); g.lineTo(670, LEG_Y + 174); g.lineTo(670, LEG_Y + 160); g.stroke();
  cap(S("INJURY"), 390, LEG_Y + 206, a * q);
  cap(S("PROPERTY"), 840, LEG_Y + 126, a * q);
}
const ROWS = [
  { head: S("INJURIES"), at: A.w1.at },
  { at: A.w1.at + 0.25, label: S("person 1"), note: S("each-person cap"), from: S("30,000"), strike: true, to: S("25,000") },
  { at: A.w2.at, label: S("person 2"), to: S("20,000") },
  { at: A.w2.at + 0.35, label: S("person 3"), op: S("+"), to: S("10,000") },
  { rule: true, at: A.w4.at },
  { at: A.w4.at + 0.2, label: S("injuries"), note: S("each-accident cap"), from: S("55,000"), strike: true, to: S("50,000") },
  { head: S("PROPERTY"), at: A.w5.at },
  { at: A.w5.at + 0.25, label: S("other cars"), from: S("28,000"), strike: true, to: S("25,000") },
  { rule: true, at: A.w6.at },
  { at: A.w6.at + 0.2, label: S("total"), op: S("="), to: S("75,000"), strong: true },
];

window.render = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.textBaseline = 'middle';
  EX.ground();
  // soft light from above, so the ground isn't a flat swatch
  const rg = g.createRadialGradient(CX, 300, 50, CX, 300, 1300);
  rg.addColorStop(0, 'rgba(255,235,210,0.07)'); rg.addColorStop(1, 'rgba(255,235,210,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);

  EX.hook(t, A.hook.at, A.hook.end, [S("ADJUSTER EXAM MATH"), S("CAN YOU GET THIS ONE?")], { y: 900 });
  EX.kicker(t, S("PRACTICE QUESTION"), { alpha: ss(A.q.at, A.q.at + 0.6, t) });

  // question phase: card + options + ring; after the reveal the card and wrong rows leave, the answer rises
  const leave = ss(RV + 1.0, RV + 1.8, t);
  const bottom = EX.card(t, A.q.at, Q, { y: CARD_Y, tag: S("example"), alpha: 1 - leave, dy: -40 * leave });
  OPT_Y = bottom + 36;
  const rowH = 100, gap = 18;
  if (leave < 1) EX.options(t, OPTS, { y: OPT_Y, rowH, gap, at: [A.o0.at, A.o1.at, A.o2.at, A.o3.at], reveal: RV, answer: ANSWER, alpha: 1 - leave, hide: t >= RV + 1.0 ? ANSWER : null });
  const ansI = OPTS.findIndex(s => s[0] === ANSWER);
  if (t >= RV + 1.0) {                            // the lit answer row travels up to be the banner
    const m = ss(RV + 1.0, RV + 1.9, t), y = lerp(OPT_Y + ansI * (rowH + gap) + rowH / 2, BANNER_Y, m);
    EX.optionRow(t, OPTS[ansI], 60, y, 960, rowH, { arrive: 1, lit: 1, alpha: 1 - ss(A.end.at, A.end.at + 0.6, t) });
  }
  EX.ring(t, A.pause.shown, 5, { x: 150, y: OPT_Y + 4 * (rowH + gap) + 92, r: 64, label: S("PAUSE AND SOLVE IT"), labelSize: 60, labelX: 254 });

  // worked answer
  legend(t);
  EX.ledger(t, ROWS, { y: LED_Y, x0: 80, xFrom: 580, xOp: 670, xTo: 1000, rowH: 94, size: 64, strongSize: 100 });
  EX.trap(t, A.trap.at, TOTAL + 1, S("THE TRAP"), TRAP, { y: 410, size: 46 });

  vignette(0.22);
  EX.endCard(t, A.end.at);
  grain(t);
};
window.ready = (async () => {
  await EX.ready();
  return { total: TOTAL, events: PLAN.events, tension: PLAN.tension, warm: PLAN.warm,
           beats: PLAN.beats.map(b => [b.id, +b.at.toFixed(2), +b.end.toFixed(2)]) };
})();
</script></body></html>
