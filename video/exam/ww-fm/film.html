<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Anton; src: url('../fonts/Anton-Regular.ttf'); }
@font-face { font-family: Inter; src: url('../../motion/fonts/Inter.ttf'); font-weight: 100 900; }
html, body { margin: 0; background: #000; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../../motion/common.js"></script>
<script src="../kit.js"></script>
<script>
// ww-fm — food-to-microorganism ratio, in the formula sheet's form: BOD lb/day over MLVSS lb.
// Flow 1.5 MGD at BOD 160 into a 0.5 MG tank at MLVSS 2,400 (MLSS 3,000 is the bait). Answer: 0.20.
const ON_SCREEN = [
  "WASTEWATER EXAM MATH", "CAN YOU GET THIS ONE?", "PRACTICE QUESTION", "example",
  "An aeration tank holds 0.5 MG. It receives 1.5 MGD of primary effluent with a BOD of 160 mg/L. MLSS is 3,000 mg/L; MLVSS is 2,400 mg/L. What is the F/M ratio?",
  "A) 0.07", "B) 0.16", "C) 0.20", "D) 5.00",
  "PAUSE AND SOLVE IT", "5", "4", "3", "2", "1",
  "FORMULA SHEET", "F/M =", "BOD, lb/day", "MLVSS, lb",
  "FOOD", "flow × BOD × 8.34", "1.5 × 160 × 8.34", "=", "2,001.6",
  "MICROORGANISMS", "volume × MLVSS × 8.34", "0.5 × 2,400 × 8.34", "10,008",
  "F/M", "food ÷ microorganisms", "2,001.6 ÷ 10,008", "0.20",
  "shortcut", "8.34 cancels", "240 ÷ 1,200",
  "THE TRAP", "B) 0.16 uses MLSS. F/M divides by MLVSS, the volatile solids used to measure the microorganisms.",
  "@wastewaterexamprep", "A free practice question every morning in our group.", "Join from this Page.",
  "Unofficial. Not affiliated with any exam provider or regulator.", "Check your state's exam and formula sheet."
];
const S = EX.init(ON_SCREEN, 'ww'), T = EX.T;
const Q = S("An aeration tank holds 0.5 MG. It receives 1.5 MGD of primary effluent with a BOD of 160 mg/L. MLSS is 3,000 mg/L; MLVSS is 2,400 mg/L. What is the F/M ratio?");
const OPTS = [S("A) 0.07"), S("B) 0.16"), S("C) 0.20"), S("D) 5.00")], ANSWER = 'C';
const TRAP = S("B) 0.16 uses MLSS. F/M divides by MLVSS, the volatile solids used to measure the microorganisms.");

const PLAN = EX.schedule([
  { id: 'hook', kind: 'hook', read: [S("WASTEWATER EXAM MATH"), S("CAN YOU GET THIS ONE?")], in: 0.6, min: 2.2 },
  { id: 'q', kind: 'question', read: [S("PRACTICE QUESTION"), S("example"), Q], in: 0.9, gap: 0.3 },
  ...OPTS.map((s, i) => ({ id: 'o' + i, kind: 'option', read: [s], in: 0.4, min: 0.75 })),
  { id: 'pause', kind: 'pause', read: [S("PAUSE AND SOLVE IT")], in: 0.3, min: 5 },
  { id: 'reveal', kind: 'reveal', in: 0.4, min: 1.3 },
  { id: 'formula', kind: 'work', read: [S("FORMULA SHEET"), S("F/M ="), S("BOD, lb/day"), S("MLVSS, lb")], in: 0.9 },
  { id: 'w1', kind: 'work', read: [S("FOOD"), S("flow × BOD × 8.34"), S("1.5 × 160 × 8.34"), S("="), S("2,001.6")], in: 1.0 },
  { id: 'w2', kind: 'work', read: [S("MICROORGANISMS"), S("volume × MLVSS × 8.34"), S("0.5 × 2,400 × 8.34"), S("="), S("10,008")], in: 1.0 },
  { id: 'w3', kind: 'work', read: [S("F/M"), S("food ÷ microorganisms"), S("2,001.6 ÷ 10,008"), S("="), S("0.20")], in: 0.9, min: 1.5 },
  { id: 'w4', kind: 'work', read: [S("shortcut"), S("8.34 cancels"), S("240 ÷ 1,200"), S("="), S("0.20")], in: 0.9 },
  { id: 'trap', kind: 'trap', read: [S("THE TRAP"), TRAP], in: 0.5 },
  { id: 'end', kind: 'end', in: 0.6, min: 4.0 },
], { start: 0.2 });
const A = PLAN.at, TOTAL = PLAN.total, RV = A.reveal.at;

// ---------- layout ----------
const CARD_Y = 285, BANNER_Y = 330, FORM_Y = 440, LED_Y = 700;
const G = { y: LED_Y, x0: 80, xFrom: 645, xOp: 685, xTo: 1000, rowH: 94, size: 72, strongSize: 100 };
let OPT_Y = 0;                                   // set from the card's height each frame

const ROWS = [
  { head: S("FOOD"), note: S("flow × BOD × 8.34"), at: A.w1.at },
  { at: A.w1.at + 0.3, from: S("1.5 × 160 × 8.34"), op: S("="), to: S("2,001.6") },
  { head: S("MICROORGANISMS"), note: S("volume × MLVSS × 8.34"), at: A.w2.at },
  { at: A.w2.at + 0.3, from: S("0.5 × 2,400 × 8.34"), op: S("="), to: S("10,008") },
  { head: S("F/M"), note: S("food ÷ microorganisms"), at: A.w3.at },
  { at: A.w3.at + 0.3, from: S("2,001.6 ÷ 10,008"), op: S("="), to: S("0.20"), strong: true },
  { at: A.w4.at + 0.1, label: S("shortcut"), note: S("8.34 cancels"), from: S("240 ÷ 1,200"), op: S("="), to: S("0.20") },
];
// the kit's head rows take no note, so hand it heads without one and set each note on the head's line, right-aligned
const LED_ROWS = ROWS.map(r => r.head ? { head: r.head, at: r.at } : r);
function headNotes(t, alpha) {
  let y = LED_Y;
  for (const r of ROWS) {
    if (r.head) {
      const p = EX.eo((t - r.at - 0.15) / 0.45);
      if (p > 0) { g.font = EX.F(400, 36); g.textAlign = 'right'; g.textBaseline = 'middle';
        g.fillStyle = rgba(T.dim, 0.95 * p * alpha); g.fillText(r.note, G.xTo + (1 - p) * 12, y + 52); }
      y += 88; continue;
    }
    y += r.strong ? Math.max(G.rowH, G.strongSize * 1.25) : G.rowH;
  }
}

// the sheet's form, as a fraction with a drawn bar
function formula(t) {
  const t0 = A.formula.at, a = 1 - EX.eo((t - A.trap.at) / 0.5); if (t < t0 || a <= 0) return;
  const p0 = EX.eo((t - t0) / 0.4), p1 = EX.eo((t - t0 - 0.25) / 0.5), p2 = EX.eo((t - t0 - 0.55) / 0.5), p3 = EX.eo((t - t0 - 0.8) / 0.5);
  g.textBaseline = 'middle';
  g.font = EX.F(400, 36, 'Anton'); if ('letterSpacing' in g) g.letterSpacing = '5px'; g.textAlign = 'left';
  g.fillStyle = rgba(T.dim, a * p0); g.fillText(S("FORMULA SHEET"), 80, FORM_Y); if ('letterSpacing' in g) g.letterSpacing = '0px';
  const yb = FORM_Y + 122, xc = 650, bw = 500;
  if (p1 > 0) { g.font = EX.F(400, 100, 'Anton'); g.textAlign = 'left'; g.fillStyle = rgba(T.text, a * p1); g.fillText(S("F/M ="), 80 - (1 - p1) * 16, yb + 6); }
  if (p2 > 0) { g.fillStyle = rgba(T.text, 0.85 * a); g.fillRect(xc - bw / 2, yb - 2, bw * p2, 5); }
  g.font = EX.F(600, 60); g.textAlign = 'center';
  if (p2 > 0) { g.fillStyle = rgba(T.text, a * p2); g.fillText(S("BOD, lb/day"), xc, yb - 52 + (1 - p2) * 10); }
  if (p3 > 0) { g.fillStyle = rgba(T.text, a * p3); g.fillText(S("MLVSS, lb"), xc, yb + 56 - (1 - p3) * 10); }
}

window.render = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.textBaseline = 'middle';
  EX.ground();
  // cool light from above, so the navy isn't a flat swatch
  const rg = g.createRadialGradient(CX, 300, 50, CX, 300, 1300);
  rg.addColorStop(0, 'rgba(200,225,245,0.07)'); rg.addColorStop(1, 'rgba(200,225,245,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);

  EX.hook(t, A.hook.at, A.hook.end, [S("WASTEWATER EXAM MATH"), S("CAN YOU GET THIS ONE?")], { y: 900 });
  EX.kicker(t, S("PRACTICE QUESTION"), { alpha: ss(A.q.at, A.q.at + 0.6, t) });

  // question phase; after the reveal the card and wrong rows leave and the lit answer rises to a banner
  const leave = ss(RV + 1.0, RV + 1.8, t);
  const bottom = EX.card(t, A.q.at, Q, { y: CARD_Y, tag: S("example"), alpha: 1 - leave, dy: -40 * leave });
  OPT_Y = bottom + 36;
  const rowH = 100, gap = 18;
  if (leave < 1) EX.options(t, OPTS, { y: OPT_Y, rowH, gap, at: [A.o0.at, A.o1.at, A.o2.at, A.o3.at], reveal: RV, answer: ANSWER, alpha: 1 - leave, hide: t >= RV + 1.0 ? ANSWER : null });
  const ansI = OPTS.findIndex(s => s[0] === ANSWER);
  if (t >= RV + 1.0) {
    const m = ss(RV + 1.0, RV + 1.9, t), y = lerp(OPT_Y + ansI * (rowH + gap) + rowH / 2, BANNER_Y, m);
    EX.optionRow(t, OPTS[ansI], 60, y, 960, rowH, { arrive: 1, lit: 1, alpha: 1 - ss(A.end.at, A.end.at + 0.6, t) });
  }
  EX.ring(t, A.pause.shown, 5, { x: 150, y: OPT_Y + 4 * (rowH + gap) + 92, r: 64, label: S("PAUSE AND SOLVE IT"), labelSize: 60, labelX: 254 });

  // worked answer
  formula(t);
  EX.ledger(t, LED_ROWS, G);
  headNotes(t, 1);
  EX.trap(t, A.trap.at, TOTAL + 1, S("THE TRAP"), TRAP, { y: 410, size: 46 });

  vignette(0.22);
  EX.endCard(t, A.end.at);
  grain(t);
};
window.ready = (async () => {
  await EX.ready();
  return { total: TOTAL, events: PLAN.events, tension: PLAN.tension, warm: PLAN.warm,
           beats: PLAN.beats.map(b => [b.id, +b.at.toFixed(2), +b.end.toFixed(2)]) };
})();
</script></body></html>
