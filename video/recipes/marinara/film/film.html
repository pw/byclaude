<script>

// ---------- timing ----------
const L = Object.fromEntries(P.lines.map(l => [l.id, l]));
const norm = w => w.toLowerCase().replace(/[^a-z0-9]/g, '');

  c.fillStyle = 'rgba(0,0,0,0.12)'; c.beginPath(); c.ellipse(4, 26, 100, 18, 0, 0, 7); c.fill();

  c.fillStyle = '#fbf3e3'; c.strokeStyle = rgb(INK, 0.25); c.lineWidth = 2;
  c.beginPath(); c.moveTo(4, -140); c.quadraticCurveTo(60, -100, 4, -20); c.closePath(); c.fill(); c.stroke();

  c.fillStyle = rgb(RED); c.beginPath(); c.moveTo(3, -150); c.lineTo(30, -144); c.lineTo(3, -138); c.fill();
  c.fillStyle = rgb(WOOD_D); c.beginPath(); c.moveTo(-95, -10); c.lineTo(95, -14); c.quadraticCurveTo(80, 30, 60, 34); c.lineTo(-70, 34); c.quadraticCurveTo(-90, 20, -95, -10); c.fill();
  c.fillStyle = rgb(WOOD); c.fillRect(-82, 0, 160, 6);

function terracottaPot(c, x, y, s) {
  c.save(); c.translate(x, y); c.scale(s, s);
  const gr = c.createLinearGradient(-90, 0, 90, 0); gr.addColorStop(0, '#a5502c'); gr.addColorStop(0.45, '#d2774a'); gr.addColorStop(1, '#93431f');
  c.fillStyle = gr; c.beginPath(); c.moveTo(-80, 0); c.lineTo(80, 0); c.lineTo(62, 150); c.lineTo(-62, 150); c.closePath(); c.fill();
  c.fillStyle = '#c4683c'; rr(c, -96, -28, 192, 38, 8); c.fill();

function leaf(c, x, y, len, ang, col = LEAF) {

  c.beginPath(); c.moveTo(0, 0);

  c.strokeStyle = rgb([70, 80, 44]); c.lineWidth = 9; c.lineCap = 'round';

function book(c, x, y, s, open, t, hl) {
