<script>
// "30,000 lawsuits" -- Northern Leasing, as a case file. Motion-design twin of short-lease-30000-judgments:
// same soundtrack, same timing (lines.json), only the picture changes. Every string on screen is in ON_SCREEN.
const ON_SCREEN = [
  "NORTHERN LEASING",
  "A credit card machine.", "A FEW HUNDRED", "DOLLARS", "A FEW HUNDRED DOLLARS", "Over the life of the lease,", "thousands.",
  "TYPICALLY 48 MONTHS", "RENEWS MONTH TO MONTH", "PER NEW YORK'S ATTORNEY GENERAL",
  "FLOWER SHOPS", "HAIR SALONS", "BODEGAS", "BARS",
  "LEASE AGREEMENT", "NON-CANCELABLE", "ANY LAWSUIT: NEW YORK",
  "The leases couldn't", "be cancelled.", "Any lawsuit had to be", "brought in New York,", "wherever", "the owner lived.",
  "2010", "2015", "NEW YORK", "NEW YORK CITY CIVIL COURT", "EACH DOT, ONE LAWSUIT",
  "More than", "30,000 lawsuits.", "More than 95% lived", "outside New York.",
  "CIVIL COURT CALENDAR", "A SEPARATE CALENDAR", "NORTHERN LEASING v.", "v.",
  "A calendar", "just for its cases.",
  "More than 19,000", "default judgments.", "CREDIT REPORT", "DEFAULT JUDGMENT", "PLAINTIFF", "COURT",
  "Many found out when they", "checked their credit reports.",
  "2020", "29,617 DEFAULT JUDGMENTS", "29,617", "thrown out.",
  "THE COURT FOUND", "OWNERS ACROSS THE COUNTRY", "LAWSUITS IN NEW YORK", "To defend lawsuits", "in New York.",
  "Service to", "obsolete addresses.",
  "Thwarted their ability", "to defend themselves.", "29,617 THROWN OUT"
];
const OK = new Set(ON_SCREEN);
const S = s => { if (!OK.has(s)) throw new Error('string not in ON_SCREEN: ' + s); return s; };

const TOTAL = P.total || 70.875;
const BG = [11, 11, 13], BONE = [232, 224, 206], PAPER = [226, 217, 197], INK = [26, 24, 22], MUTE = [128, 122, 112],
      DIM = [70, 68, 64], AMB = [245, 166, 52];
const win = (t, a, b, fi = 0.35, fo = 0.35) => ss(a, a + fi, t) * (1 - ss(b - fo, b, t));

// ---------- text ----------
function label(s, x, y, o = {}) {
  const { size = 24, weight = 600, col = BONE, a = 1, align = 'center', ls = 4 } = o;
  if (a <= 0.003) return;
  g.font = `${weight} ${size}px Inter`; g.letterSpacing = `${ls}px`; g.textAlign = align; g.textBaseline = 'middle';
  g.fillStyle = rgba(col, a); g.fillText(S(s), align === 'center' ? x + ls / 2 : x, y); g.letterSpacing = '0px';
}
// the big line: Instrument Serif, each row with its own alpha, rises into place
function big(rows, y0 = 1420, size = 92) {
  rows.forEach((r, i) => {
    const a = r.a ?? 1; if (a <= 0.003) return;
    g.font = `${size}px ${r.it ? 'ISI' : 'IS'}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.letterSpacing = '0px';
    g.fillStyle = rgba(r.c || BONE, a); g.fillText(S(r.s), CX, y0 + i * size * 1.08 + 18 * (1 - a));
  });
}
function pill(x, y, w, h, a) { g.fillStyle = rgba(BG, 0.82 * a); g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, h / 2); g.fill(); }

// ---------- ground ----------
function ground() {
  g.fillStyle = rgba(BG, 1); g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,0.022)'; g.lineWidth = 1; g.beginPath();
  for (let x = 0; x <= W; x += 60) { g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); }
  for (let y = 0; y <= H; y += 60) { g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); }
  g.stroke();
}
function kicker(t) {
  const a = 0.8 * ss(0.1, 0.9, t);
  g.font = '600 26px Inter'; g.letterSpacing = '7px'; const w = g.measureText(S('NORTHERN LEASING')).width; g.letterSpacing = '0px';
  const x0 = CX - (w + 30) / 2;
  g.fillStyle = rgba(AMB, a); g.fillRect(x0, 164, 14, 14);
  label('NORTHERN LEASING', x0 + 30, 172, { size: 26, ls: 7, align: 'left', a, col: BONE });
}

// ---------- beat 1: the machine and the lease ----------
function terminal(x, y, s, a) {   // (x,y) = bottom centre
  if (a <= 0) return;
  const w = 200 * s, h = 330 * s, x0 = x - w / 2, y0 = y - h;
  g.fillStyle = rgba([40, 38, 36], a); g.strokeStyle = rgba(BONE, 0.85 * a); g.lineWidth = Math.max(2, 3 * s);
  g.beginPath(); g.roundRect(x0, y0, w, h, 26 * s); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x0 + 40 * s, y0 + 22 * s); g.lineTo(x0 + w - 40 * s, y0 + 22 * s); g.stroke();              // card slot
  g.fillStyle = rgba([16, 16, 18], a); g.beginPath(); g.roundRect(x0 + 24 * s, y0 + 44 * s, w - 48 * s, 92 * s, 8 * s); g.fill();
  g.fillStyle = rgba(AMB, 0.9 * a); g.fillRect(x0 + 42 * s, y0 + 78 * s, 70 * s, 8 * s);                            // screen line
  g.fillStyle = rgba(AMB, 0.4 * a); g.fillRect(x0 + 42 * s, y0 + 98 * s, 40 * s, 6 * s);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) {
    g.fillStyle = rgba(BONE, (r === 3 && c !== 1 ? 0.35 : 0.7) * a);
    g.beginPath(); g.roundRect(x0 + (32 + c * 50) * s, y0 + (160 + r * 40) * s, 36 * s, 26 * s, 6 * s); g.fill();
  }
}
const SLIP_T = Array.from({ length: 56 }, (_, k) => k < 48 ? 6.15 + 2.55 * Math.sqrt(k / 47) : 8.95 + (k - 48) * 0.16);
const FLOOR = 1250, PITCH = 16, SX = 720, SW = 300;
function beat1(t) {
  const A = 1 - ss(10.25, 10.85, t); if (A <= 0) return;
  const move = ss(3.75, 5.0, t);
  const mx = lerp(540, 290, move), my = lerp(1010, FLOOR, move), ms = lerp(1.45, 0.72, move);
  // floor
  const fa = ss(3.9, 4.8, t) * A;
  g.strokeStyle = rgba(BONE, 0.35 * fa); g.lineWidth = 2; g.beginPath(); g.moveTo(90, FLOOR + 1); g.lineTo(990, FLOOR + 1); g.stroke();
  terminal(mx, my + 12 * (1 - ss(0.1, 1.1, t)), ms, ss(0.1, 1.0, t) * A);
  // the price tag, hung off the machine while it is alone
  const tagA = ss(1.8, 2.4, t) * (1 - ss(3.7, 4.2, t)) * A;
  if (tagA > 0) {
    const sw = Math.sin(t * 2.2) * 0.04 * (1 - ss(2, 3.5, t)) + 0.05;
    const hx = mx + 100 * ms - 12, hy = my - 330 * ms + 20;
    g.save(); g.translate(hx, hy); g.rotate(sw);
    g.strokeStyle = rgba(BONE, 0.6 * tagA); g.lineWidth = 2; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(60, 20, 90, 70); g.stroke();
    g.translate(90, 70); g.rotate(0.12);
    g.fillStyle = rgba(PAPER, tagA); g.beginPath();
    g.moveTo(0, 0); g.lineTo(40, -46); g.lineTo(330, -46); g.lineTo(330, 96); g.lineTo(40, 96); g.closePath(); g.fill();
    g.fillStyle = rgba(BG, tagA); g.beginPath(); g.arc(26, 0, 7, 0, 6.283); g.fill();
    g.font = '700 28px Inter'; g.letterSpacing = '2px'; g.textAlign = 'center'; g.fillStyle = rgba(INK, tagA);
    g.fillText(S('A FEW HUNDRED'), 186, 6); g.fillText(S('DOLLARS'), 186, 46); g.letterSpacing = '0px';
    g.restore();
  }
  // the machine's level, carried across as a dashed line
  const lvA = ss(4.8, 5.6, t) * A, lvY = FLOOR - 330 * 0.72;
  if (lvA > 0) {
    g.setLineDash([10, 9]); g.strokeStyle = rgba(BONE, 0.5 * lvA); g.lineWidth = 2;
    g.beginPath(); g.moveTo(170, lvY); g.lineTo(lerp(170, 900, ss(4.8, 5.8, t)), lvY); g.stroke(); g.setLineDash([]);
    label('A FEW HUNDRED DOLLARS', 170, lvY - 26, { size: 22, align: 'left', a: 0.85 * lvA, ls: 3 });
  }
  // the lease: a payment slip for every month, falling onto a stack that climbs far past the machine
  for (let k = 0; k < 56; k++) {
    const t0 = SLIP_T[k]; if (t < t0) continue;
    const e = ss(t0, t0 + 0.32, t), top = FLOOR - (k + 1) * PITCH;
    const y = lerp(top - 260, top, e * e), a = e * A, renew = k >= 48;
    g.fillStyle = rgba(renew ? BG : PAPER, a); g.strokeStyle = rgba(renew ? AMB : BONE, (renew ? 0.8 : 0.3) * a); g.lineWidth = 2;
    g.beginPath(); g.roundRect(SX - SW / 2, y, SW, PITCH - 4, 3); g.fill(); if (renew) { g.setLineDash([6, 5]); g.stroke(); g.setLineDash([]); }
    if (!renew) { g.fillStyle = rgba(AMB, a); g.fillRect(SX - SW / 2 + 8, y + 3, 16, PITCH - 10);
      g.fillStyle = rgba(INK, 0.35 * a); g.fillRect(SX - SW / 2 + 34, y + 4, 90 + (k * 37) % 70, 4); g.fillRect(SX + SW / 2 - 60, y + 4, 46, 4); }
  }
  // bracket: 48 months
  const brA = ss(8.75, 9.2, t) * A, b48 = FLOOR - 48 * PITCH;
  if (brA > 0) {
    g.strokeStyle = rgba(BONE, 0.6 * brA); g.lineWidth = 2; g.beginPath();
    g.moveTo(SX + SW / 2 + 16, FLOOR - 4); g.lineTo(SX + SW / 2 + 30, FLOOR - 4); g.lineTo(SX + SW / 2 + 30, b48 + 2); g.lineTo(SX + SW / 2 + 16, b48 + 2); g.stroke();
    g.save(); g.translate(SX + SW / 2 + 60, (FLOOR + b48) / 2); g.rotate(-Math.PI / 2);
    label('TYPICALLY 48 MONTHS', 0, 0, { size: 22, a: 0.85 * brA, ls: 3 }); g.restore();
  }
  label('RENEWS MONTH TO MONTH', SX, FLOOR - 56 * PITCH - 30, { size: 22, col: AMB, a: ss(9.3, 9.8, t) * A, ls: 3 });
  // big lines
  big([{ s: 'A credit card machine.', a: win(t, 0.4, 3.75, 0.5, 0.4) }], 1430);
  big([{ s: 'Over the life of the lease,', a: win(t, 3.9, 10.4, 0.5, 0.4) },
       { s: 'thousands.', it: true, c: AMB, a: win(t, 8.75, 10.4, 0.3, 0.4) }], 1400);
  label('PER NEW YORK\'S ATTORNEY GENERAL', CX, 1590, { size: 20, col: MUTE, a: win(t, 9.0, 10.4, 0.4, 0.4), ls: 3 });
}

// ---------- beat 2: who it was, and the lease they signed ----------
const SHOPS = [{ x: 170, k: 0, t0: 10.9, s: 'FLOWER SHOPS' }, { x: 413, k: 1, t0: 12.05, s: 'HAIR SALONS' },
               { x: 656, k: 2, t0: 13.2, s: 'BODEGAS' }, { x: 900, k: 3, t0: 13.85, s: 'BARS' }];
const SHOP_TOP = 360, SHOP_W = 200, SHOP_H = 220;
function shop(sh, t, A) {
  const e = ss(sh.t0, sh.t0 + 0.45, t), a = e * A; if (a <= 0) return;
  const x0 = sh.x - SHOP_W / 2, y0 = SHOP_TOP + 30 * (1 - e);
  g.strokeStyle = rgba(BONE, 0.8 * a); g.lineWidth = 3; g.fillStyle = rgba([22, 21, 20], a);
  g.beginPath(); g.rect(x0, y0 + 40, SHOP_W, SHOP_H - 40); g.fill(); g.stroke();
  // awning: scalloped, banded
  for (let i = 0; i < 5; i++) { g.fillStyle = rgba(i % 2 ? [48, 46, 43] : BONE, (i % 2 ? 1 : 0.85) * a); g.fillRect(x0 - 8 + i * 43.2, y0, 43.2, 40); }
  for (let i = 0; i < 5; i++) { g.fillStyle = rgba(i % 2 ? [48, 46, 43] : BONE, (i % 2 ? 1 : 0.85) * a); g.beginPath(); g.arc(x0 - 8 + i * 43.2 + 21.6, y0 + 40, 21.6, 0, Math.PI); g.fill(); }
  // window + door
  const wx = x0 + 18, wy = y0 + 80, ww = 110, wh = 100;
  g.strokeStyle = rgba(BONE, 0.7 * a); g.lineWidth = 2; g.strokeRect(wx, wy, ww, wh); g.strokeRect(x0 + 144, y0 + 90, 40, SHOP_H - 90);
  g.fillStyle = rgba(BONE, 0.7 * a); g.beginPath(); g.arc(x0 + 176, y0 + 160, 3, 0, 6.283); g.fill();
  // what the shop is, drawn in the window
  const cx = wx + ww / 2, cy = wy + wh / 2; g.strokeStyle = rgba(BONE, 0.9 * a); g.fillStyle = rgba(BONE, 0.9 * a); g.lineWidth = 2.5;
  if (sh.k === 0) { g.beginPath(); g.moveTo(cx, cy + 40); g.lineTo(cx, cy - 4); g.stroke();
    g.beginPath(); g.moveTo(cx, cy + 20); g.quadraticCurveTo(cx + 22, cy + 10, cx + 26, cy + 20); g.stroke();
    for (let p = 0; p < 6; p++) { const an = p * 1.047; g.beginPath(); g.arc(cx + Math.cos(an) * 13, cy - 16 + Math.sin(an) * 13, 8, 0, 6.283); g.stroke(); }
    g.fillStyle = rgba(AMB, a); g.beginPath(); g.arc(cx, cy - 16, 6, 0, 6.283); g.fill(); }
  if (sh.k === 1) { g.beginPath(); g.arc(cx - 14, cy + 22, 10, 0, 6.283); g.stroke(); g.beginPath(); g.arc(cx + 14, cy + 22, 10, 0, 6.283); g.stroke();
    g.beginPath(); g.moveTo(cx - 8, cy + 14); g.lineTo(cx + 16, cy - 36); g.moveTo(cx + 8, cy + 14); g.lineTo(cx - 16, cy - 36); g.stroke();
    g.fillStyle = rgba(AMB, a); g.beginPath(); g.arc(cx, cy + 2, 3.5, 0, 6.283); g.fill(); }
  if (sh.k === 2) { for (let r = 0; r < 3; r++) { g.beginPath(); g.moveTo(wx + 10, wy + 32 + r * 30); g.lineTo(wx + ww - 10, wy + 32 + r * 30); g.stroke();
      for (let c = 0; c < 5; c++) { g.fillStyle = rgba(c === 2 && r === 1 ? AMB : BONE, 0.8 * a); g.fillRect(wx + 14 + c * 18, wy + 14 + r * 30, 12, 17); } } }
  if (sh.k === 3) { g.beginPath(); g.moveTo(cx - 30, cy - 30); g.lineTo(cx + 30, cy - 30); g.lineTo(cx, cy + 4); g.closePath(); g.stroke();
    g.beginPath(); g.moveTo(cx, cy + 4); g.lineTo(cx, cy + 34); g.moveTo(cx - 18, cy + 36); g.lineTo(cx + 18, cy + 36); g.stroke();
    g.fillStyle = rgba(AMB, 0.9 * a); g.beginPath(); g.moveTo(cx - 20, cy - 20); g.lineTo(cx + 20, cy - 20); g.lineTo(cx, cy); g.closePath(); g.fill(); }
  label(sh.s, sh.x, SHOP_TOP + SHOP_H + 40, { size: 22, a: 0.9 * a, ls: 3 });
}
const DOC = { x0: 250, x1: 830, y0: 700, y1: 1300 }, CLAUSE_Y = 1175;
const FINE = []; { const r = rng(7); for (let y = DOC.y0 + 112; y < DOC.y1 - 30; y += 15) { const row = []; let x = DOC.x0 + 40;
  while (x < DOC.x1 - 60) { const w = 10 + r() * 38; row.push([x, w]); x += w + 7; } FINE.push({ y, row }); } }
function beat2(t) {
  const A = ss(10.7, 11.1, t) * (1 - ss(20.95, 21.5, t)); if (A <= 0) return;
  SHOPS.forEach(sh => shop(sh, t, A));
  // wherever the owner lived: every shop's thread runs into the one clause
  const th = ss(19.45, 20.3, t) * A;
  if (th > 0) {
    g.strokeStyle = rgba(AMB, 0.75 * th); g.lineWidth = 2.5; g.setLineDash([8, 7]);
    for (const sh of SHOPS) { const x0 = sh.x, y0 = SHOP_TOP + SHOP_H + 64, x1 = CX + (sh.x - CX) * 0.35, y1 = CLAUSE_Y - 30;
      const e = ss(19.45, 20.2, t); g.beginPath(); g.moveTo(x0, y0); g.lineTo(lerp(x0, x1, e), lerp(y0, y1, e)); g.stroke(); }
    g.setLineDash([]);
  }
  // the lease agreement
  const de = ss(14.55, 15.05, t), da = de * A;
  if (da > 0) {
    const oy = 60 * (1 - de);
    g.save(); g.translate(0, oy);
    g.fillStyle = rgba([0, 0, 0], 0.5 * da); g.fillRect(DOC.x0 + 14, DOC.y0 + 16, DOC.x1 - DOC.x0, DOC.y1 - DOC.y0);
    g.fillStyle = rgba(PAPER, da); g.fillRect(DOC.x0, DOC.y0, DOC.x1 - DOC.x0, DOC.y1 - DOC.y0);
    label('LEASE AGREEMENT', CX, DOC.y0 + 56, { size: 30, weight: 700, col: INK, a: da, ls: 5 });
    g.fillStyle = rgba(INK, 0.6 * da); g.fillRect(DOC.x0 + 40, DOC.y0 + 88, DOC.x1 - DOC.x0 - 80, 2);
    // fine print (drawn, not written: it was printed in miniscule type)
    const hl = ss(16.75, 17.4, t);
    g.fillStyle = rgba(INK, 0.32 * da);
    for (const f of FINE) { if (Math.abs(f.y - CLAUSE_Y) < 30 && hl > 0) continue; for (const [x, w] of f.row) g.fillRect(x, f.y, w, 5); }
    if (hl > 0) {   // the forum clause, highlighted and made legible
      g.fillStyle = rgba(AMB, 0.95 * da); g.fillRect(DOC.x0 + 30, CLAUSE_Y - 26, (DOC.x1 - DOC.x0 - 60) * hl, 52);
      label('ANY LAWSUIT: NEW YORK', CX, CLAUSE_Y, { size: 30, weight: 800, col: INK, a: ss(17.1, 17.4, t) * da, ls: 3 });
    }
    // stamp
    const st = ss(14.95, 15.15, t);
    if (st > 0) {
      g.save(); g.translate(CX, 930); g.rotate(-0.12); const sc = lerp(1.7, 1, st); g.scale(sc, sc);
      g.globalAlpha = st * A; g.fillStyle = rgba(PAPER, 0.93); g.fillRect(-255, -48, 510, 96);
      g.strokeStyle = rgba(AMB, 1); g.lineWidth = 6; g.strokeRect(-255, -48, 510, 96); g.lineWidth = 2; g.strokeRect(-243, -36, 486, 72);
      label('NON-CANCELABLE', 0, 3, { size: 44, weight: 800, col: [214, 132, 22], ls: 2 }); g.globalAlpha = 1; g.restore();
    }
    g.restore();
  }
  big([{ s: 'The leases couldn\'t', a: win(t, 14.8, 16.65, 0.35, 0.3) }, { s: 'be cancelled.', a: win(t, 14.95, 16.65, 0.35, 0.3) }], 1420);
  big([{ s: 'Any lawsuit had to be', a: win(t, 16.75, 19.45, 0.35, 0.3) }, { s: 'brought in New York,', a: win(t, 17.6, 19.45, 0.35, 0.3) }], 1420);
  big([{ s: 'wherever', a: win(t, 19.55, 21.0, 0.3, 0.4) }, { s: 'the owner lived.', it: true, c: AMB, a: win(t, 19.9, 21.0, 0.3, 0.4) }], 1420);
}

// ---------- the 30,000: one dot per lawsuit ----------
const C = { x: 540, y: 820 }, RING = 165, N = 30000, NIN = 1350;   // under 5% start inside the New York ring
const hx = new Float32Array(N), hy = new Float32Array(N), bt = new Float32Array(N), td = new Float32Array(N),
      ax = new Float32Array(N), ay = new Float32Array(N), crv = new Float32Array(N), jt = new Float32Array(N).fill(1e9);
{
  const r = rng(1729), CL = [];
  while (CL.length < 70) { const x = 90 + r() * 900, y = 400 + r() * 880; if (Math.hypot(x - C.x, y - C.y) > 240) CL.push([x, y, 10 + r() * 38]); }
  const gauss = () => Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(6.2832 * r());
  for (let i = 0; i < N; i++) {
    let x, y;
    if (i < NIN) { const an = r() * 6.2832, rr = 126 + r() * 34; x = C.x + Math.cos(an) * rr; y = C.y + Math.sin(an) * rr; }
    else for (;;) {
      if (r() < 0.72) { const c = CL[Math.floor(r() * CL.length)]; x = c[0] + gauss() * c[2]; y = c[1] + gauss() * c[2] * 0.8; }
      else { x = 80 + r() * 920; y = 390 + r() * 910; }
      if (x > 72 && x < 1008 && y > 385 && y < 1300 && Math.hypot(x - C.x, y - C.y) > 190) break;
    }
    hx[i] = x; hy[i] = y; bt[i] = 21.8 + 7.6 * Math.sqrt(r()); td[i] = 1.3 + 0.9 * r(); crv[i] = (r() - 0.5) * 120;
  }
  // arrival: they pile up around the court in the order they arrive
  const ord = Array.from({ length: N }, (_, i) => i).sort((a, b) => (bt[a] + td[a]) - (bt[b] + td[b]));
  ord.forEach((i, k) => { const rr = Math.sqrt(52 * 52 + (k / N) * (118 * 118 - 52 * 52)), an = k * 2.39996;
    ax[i] = C.x + Math.cos(an) * rr; ay[i] = C.y + Math.sin(an) * rr; });
  // more than 19,000 default judgments: 19,000 of them travel back out to where the person lived
  const perm = Array.from({ length: N }, (_, i) => i); for (let i = N - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let k = 0; k < 19000; k++) jt[perm[k]] = 44.7 + 3.3 * Math.sqrt(r());
}
// the credit report rises from one of the 19,000 homes
let CR_HOME = 0; { let best = 1e9; for (let i = 0; i < N; i++) if (jt[i] < 1e8) { const d = Math.hypot(hx[i] - 860, hy[i] - 1180); if (d < best) { best = d; CR_HOME = i; } } }

function court(x, y, s, a, col = BONE) {
  if (a <= 0) return;
  g.fillStyle = rgba(BG, 0.92 * a); g.beginPath(); g.arc(x, y, 50 * s, 0, 6.283); g.fill();
  g.strokeStyle = rgba(col, a); g.fillStyle = rgba(col, a); g.lineWidth = 3 * s;
