<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Corm;src:url(fonts/CormorantGaramond.ttf)}
@font-face{font-family:CormI;src:url(fonts/CormorantGaramond-Italic.ttf)}
@font-face{font-family:Gar;src:url(fonts/EBGaramond.ttf)}
@font-face{font-family:GarI;src:url(fonts/EBGaramond-Italic.ttf)}
@font-face{font-family:Heb;src:url(fonts/FrankRuhlLibre.ttf)}
@font-face{font-family:Mono;src:url(fonts/IBMPlexMono-Regular.ttf)}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas><script>
const W = 1920, H = 1080, cv = document.getElementById('c'), X = cv.getContext('2d');
const C = {bg:'#14110d', ink:'#ece2cc', dim:'#9b927f', faint:'#5b544a', J:'#e3a64b', E:'#4fb7a8', D:'#d4604f', P:'#8f9cf5', X:'#7d766b', EL:'#a9bcd9', NP:'#b8a48a'};
const P = window.PARAMS; const TL = P.timing; const FLOOD = P.flood; const NAMES = P.names;
// ---------- timing helpers ----------
const L = (s, i) => TL.lines[s][i];                 // {s: start, d: dur}
const ls = (s, i) => L(s, i).s, le = (s, i) => L(s, i).s + L(s, i).d;
const sc = s => TL.scenes[s];                         // {a, b} visible window
const ss = (a, b, x) => { const y = Math.min(1, Math.max(0, (x - a) / (b - a))); return y * y * (3 - 2 * y); };
const lerp = (a, b, k) => a + (b - a) * k;
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
// fraction through a line (for pacing words across a spoken line)
const lf = (s, i, t) => Math.min(1, Math.max(0, (t - ls(s, i)) / L(s, i).d));

// ---------- drawing helpers ----------
function font(f, size) { X.font = `${size}px ${f}`; }
function text(str, x, y, o = {}) {
  X.save(); X.globalAlpha *= (o.a ?? 1); font(o.f || 'Gar', o.size || 40); X.fillStyle = o.c || C.ink;
  X.textAlign = o.al || 'left'; X.textBaseline = o.bl || 'alphabetic';
  if (o.ls) X.letterSpacing = o.ls + 'px';
  X.fillText(str, x, y); X.restore();
}
function wrapWords(words, maxW) { const lines = []; let cur = [], w = 0; const sp = X.measureText(' ').width;
  for (const wd of words) { const ww = X.measureText(wd.t).width; if (cur.length && w + sp + ww > maxW) { lines.push(cur); cur = []; w = 0; } wd.w = ww; w += (cur.length ? sp : 0) + ww; cur.push(wd); }
  if (cur.length) lines.push(cur); return lines; }
// rich paragraph: highlights = [{p: phrase, c: color, k: 0..1}] ; reveal = 0..1 word-by-word
function para(str, cx, y, maxW, o = {}) {
  X.save(); font(o.f || 'Gar', o.size || 44); X.textBaseline = 'alphabetic';
  const words = []; let pos = 0; for (const t of str.split(' ')) { words.push({t, a: pos, b: pos + t.length}); pos += t.length + 1; }
  for (const h of (o.hl || [])) { const i = str.indexOf(h.p); if (i < 0) continue; for (const w of words) if (w.a < i + h.p.length && w.b > i) w.h = h; }
  const lines = wrapWords(words, maxW), lh = o.lh || (o.size || 44) * 1.42, sp = X.measureText(' ').width;
  const n = words.length, rev = o.reveal ?? 1; let k = 0;
  lines.forEach((ln, li) => { const tw = ln.reduce((s, w) => s + w.w, 0) + sp * (ln.length - 1);
    let x = o.al === 'left' ? cx : cx - tw / 2;
    for (const w of ln) { const wa = Math.min(1, Math.max(0, rev * n - k)); k++;
      X.globalAlpha = (o.a ?? 1) * wa;
      X.fillStyle = w.h ? mix(o.c || C.ink, w.h.c, w.h.k) : (o.c || C.ink);
      if (w.h && w.h.k > 0.01 && w.h.glow) { X.shadowColor = w.h.c; X.shadowBlur = 18 * w.h.k; } else X.shadowBlur = 0;
      X.fillText(w.t, x, y + li * lh); x += w.w + sp; } });
  X.restore(); return lines.length * lh; }
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mix(a, b, k) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }
function rrect(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function line(x1, y1, x2, y2, c, w = 2, a = 1) { X.save(); X.globalAlpha *= a; X.strokeStyle = c; X.lineWidth = w; X.beginPath(); X.moveTo(x1, y1); X.lineTo(x2, y2); X.stroke(); X.restore(); }
function chip(str, x, y, c, a = 1, size = 26) { X.save(); X.globalAlpha *= a; font('Mono', size); const w = X.measureText(str).width + size * 1.1;
  rrect(x, y - size * 0.95, w, size * 1.45, 6); X.fillStyle = c + '26'; X.fill(); X.strokeStyle = c; X.lineWidth = 1.5; X.stroke();
  X.fillStyle = c; X.textBaseline = 'alphabetic'; X.fillText(str, x + size * 0.55, y + size * 0.1); X.restore(); return w; }
function caption(str, a = 1) { text(str, W / 2, H - 58, {f: 'Mono', size: 20, c: C.dim, al: 'center', a, ls: 1}); }

// ---------- background ----------
const grains = []; for (let g = 0; g < 6; g++) { const c = document.createElement('canvas'); c.width = 480; c.height = 270; const x = c.getContext('2d'), im = x.createImageData(480, 270);
  for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 14; } x.putImageData(im, 0, 0); grains.push(c); }
function background(t) {
  X.fillStyle = C.bg; X.fillRect(0, 0, W, H);
  const g = X.createRadialGradient(W * 0.5, H * 0.42, 50, W * 0.5, H * 0.5, W * 0.75);
  g.addColorStop(0, 'rgba(70,52,30,0.30)'); g.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = g; X.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) { const x = (hash(i) * W + t * (6 + hash(i + 9) * 10)) % W, y = (hash(i + 3) * H - t * (3 + hash(i + 5) * 6) % H + H) % H;
    X.globalAlpha = 0.10 + 0.12 * Math.sin(t * 0.7 + i); X.fillStyle = '#e8cfa0'; X.beginPath(); X.arc(x, y, 1 + hash(i + 7) * 1.6, 0, 7); X.fill(); }
  X.globalAlpha = 1; }
function finish(t) {
  const v = X.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  X.fillStyle = v; X.fillRect(0, 0, W, H); X.drawImage(grains[Math.floor(t * 24) % 6], 0, 0, W, H); }

// scene alpha: fade in over 0.7s at a, out over 0.7s before b
function sa(s, t) { const w = sc(s); return ss(w.a, w.a + 0.7, t) * (1 - ss(w.b - 0.7, w.b, t)); }
const on = (s, t) => t >= sc(s).a && t <= sc(s).b;

// ================= SCENES =================
function sOpen(t) { const A = sa('open', t); X.globalAlpha = A;
  const q = 'So Moses the servant of Yahweh died there in the land of Moab. He buried him in the valley, opposite Beth Peor, but no man knows where his tomb is to this day.';
  const k2 = s => ss(ls('open', 2) + L('open', 2).d * s, ls('open', 2) + L('open', 2).d * s + 0.5, t);
  const up = ss(le('open', 0), le('open', 0) + 1.2, t);
  para(q, W / 2, lerp(470, 400, up), 1280, {f: 'GarI', size: 54, lh: 80, reveal: ss(ls('open', 0), le('open', 0) - 0.3, t),
    hl: [{p: 'died there', c: C.J, k: k2(0.25), glow: 1}, {p: 'He buried him', c: C.J, k: k2(0.4), glow: 1}, {p: 'to this day.', c: C.J, k: k2(0.72), glow: 1}]});
  text('DEUTERONOMY 34:5–6', W / 2, 330 - up * 70, {f: 'Mono', size: 22, c: C.dim, al: 'center', a: ss(ls('open', 0) + 1, ls('open', 0) + 2, t), ls: 3});
  const b = ss(ls('open', 1), ls('open', 1) + 1, t);
  if (b > 0) { const names = ['Genesis', 'Exodus', 'Leviticus', 'Numbers', 'Deuteronomy'];
    names.forEach((n, i) => { const a = b * ss(ls('open', 1) + 0.3 + i * 0.25, ls('open', 1) + 0.9 + i * 0.25, t);
      text(n, W / 2 + (i - 2) * 300, 780, {f: 'Corm', size: 40, c: i === 4 ? C.ink : C.dim, al: 'center', a}); });
    text('by Moses?', W / 2, 850, {f: 'CormI', size: 36, c: C.J, al: 'center', a: b * ss(ls('open', 1) + L('open', 1).d * 0.6, ls('open', 1) + L('open', 1).d * 0.6 + 0.8, t)}); }
  X.globalAlpha = 1; }

function threads(t, x0, x1, yc, amp, alpha, spread) { // four braided threads across the screen
  const cols = [C.J, C.E, C.D, C.P];
  cols.forEach((c, i) => { X.save(); X.globalAlpha = alpha; X.strokeStyle = c; X.lineWidth = 5; X.lineCap = 'round'; X.beginPath();
    for (let x = x0; x <= x1; x += 6) { const u = (x - x0) / (x1 - x0);
      const y = yc + (spread ? (i - 1.5) * spread * (1 - ss(0.1, 0.55, u)) : 0) + amp * ss(0.05, 0.5, u) * Math.sin(x * 0.012 - t * 1.4 + i * Math.PI / 2);
      x === x0 ? X.moveTo(x, y) : X.lineTo(x, y); }
    X.stroke(); X.restore(); }); }

function sTitle(t) { const w = sc('title'), A = ss(w.a, w.a + 0.8, t) * (1 - ss(w.b - 0.8, w.b, t));
  const draw = ss(w.a, w.a + 2.2, t); threads(t, 0, lerp(0, W, draw), 690, 26, A * 0.9, 90);
  text('Who Wrote the Torah?', W / 2, 520, {f: 'Corm', size: 150, al: 'center', a: A * ss(w.a + 0.5, w.a + 1.6, t)});
  text('THE YAHWIST, THE PRIESTS, AND THE EDITORS WHO KEPT BOTH', W / 2, 830, {f: 'Mono', size: 22, c: C.dim, al: 'center', ls: 4, a: A * ss(w.a + 1.2, w.a + 2.2, t)}); }

function scroll(x, y, w, h, label, c, a, hl) { X.save(); X.globalAlpha *= a;
  rrect(x, y, w, h, 10); X.fillStyle = '#231d15'; X.fill(); X.strokeStyle = c; X.lineWidth = 2; X.stroke();
  for (const yy of [y - 10, y + h - 6]) { rrect(x - 12, yy, w + 24, 16, 8); X.fillStyle = '#5a4630'; X.fill(); }
  for (let k = 0; k < 9; k++) { X.globalAlpha = a * 0.35; line(x + 22, y + 40 + k * (h - 70) / 9, x + w - 22 - hash(k + x) * 50, y + 40 + k * (h - 70) / 9, C.dim, 3); }
  X.globalAlpha = a; text(label, x + w / 2, y + h + 58, {f: 'Corm', size: 36, al: 'center', c: hl ? C.ink : C.dim}); X.restore(); }
function sTradition(t) { const A = sa('tradition', t); X.save(); X.globalAlpha = A;
  const names = ['Genesis', 'Exodus', 'Leviticus', 'Numbers', 'Deuteronomy'];
  const shift = ss(ls('tradition', 2) - 0.4, ls('tradition', 2) + 0.8, t); // scrolls rise away for the timeline
  const L0 = ls('tradition', 0), D0 = L('tradition', 0).d;
  X.translate(0, -shift * 200); X.globalAlpha = A * (1 - shift);
  names.forEach((n, i) => scroll(290 + i * 290, 300, 190, 300, n, C.faint, ss(L0 + i * D0 * 0.11, L0 + i * D0 * 0.11 + 0.6, t), i === 4));
  text('תּוֹרָה', W / 2, 205, {f: 'Heb', size: 78, al: 'center', c: C.J, a: ss(L0 + D0 * 0.55, L0 + D0 * 0.7, t)});
  text('“THE FIVE BOOKS OF MOSES”', W / 2, 760, {f: 'Mono', size: 22, c: C.dim, al: 'center', ls: 4, a: ss(L0 + D0 * 0.8, L0 + D0 * 0.95, t)});
  const j = ss(ls('tradition', 1) + 1.2, ls('tradition', 1) + 2, t);
  if (j > 0) { const x = 290 + 4 * 290; X.save(); X.globalAlpha *= j; rrect(x + 16, 300 + 175, 158, 108, 6); X.fillStyle = C.J + '33'; X.fill(); X.strokeStyle = C.J; X.lineWidth = 2; X.stroke(); X.restore();
    text('the last 8 verses', x + 95, 300 + 150, {f: 'CormI', size: 28, c: C.J, al: 'center', a: j}); }
  X.restore(); X.save(); X.globalAlpha = A;
  const jt = ss(ls('tradition', 1) + 2.2, ls('tradition', 1) + 3, t) * (1 - shift);
  text('Talmud, Bava Batra 15a:  Joshua wrote them — or Moses did, “in tears”', W / 2, 860, {f: 'Mono', size: 23, c: C.J, al: 'center', a: jt});
  // timeline of doubters
  const tlA = shift; if (tlA > 0) { const y = 700; line(260, y, 1660, y, C.faint, 2, tlA);
    const ev = [[0.12, 'c. 1150', 'Abraham ibn Ezra', 'hints in “the secret of the twelve”', ls('tradition', 2) + 0.6],
                [0.60, '1651', 'Thomas Hobbes', 'Leviathan', ls('tradition', 3) + 0.8], [0.86, '1670', 'Baruch Spinoza', 'Theological-Political Treatise', ls('tradition', 3) + 1.6]];
    for (const [u, d, n, s, at] of ev) { const a = tlA * ss(at, at + 0.8, t), x = 260 + u * 1400;
      X.globalAlpha = A * a; X.fillStyle = C.J; X.beginPath(); X.arc(x, y, 9, 0, 7); X.fill();
      text(d, x, y - 36, {f: 'Mono', size: 24, c: C.J, al: 'center', a: A * a}); text(n, x, y + 62, {f: 'Corm', size: 42, al: 'center', a: A * a}); text(s, x, y + 104, {f: 'GarI', size: 26, c: C.dim, al: 'center', a: A * a}); }
    X.globalAlpha = A; para('“Moses could not have written all of this.”', W / 2, 330, 1400, {f: 'CormI', size: 60, a: ss(ls('tradition', 3) + L('tradition', 3).d * 0.55, ls('tradition', 3) + L('tradition', 3).d * 0.7, t)}); }
  X.restore(); }

function sNames(t) { const A = sa('names', t); X.save(); X.globalAlpha = A;
  const card = ss(ls('names', 0), ls('names', 0) + 1, t) * (1 - ss(ls('names', 2) - 0.5, ls('names', 2) + 0.3, t));
  text('1753', W / 2, 250, {f: 'Mono', size: 30, c: C.dim, al: 'center', a: card, ls: 6});
  text('Jean Astruc', W / 2, 330, {f: 'Corm', size: 70, al: 'center', a: card});
  text('physician · Conjectures on Genesis', W / 2, 382, {f: 'GarI', size: 30, c: C.dim, al: 'center', a: card});
  const n1 = ss(ls('names', 1), ls('names', 1) + 0.8, t) * card, n2 = ss(ls('names', 1) + L('names', 1).d * 0.45, ls('names', 1) + L('names', 1).d * 0.45 + 0.8, t) * card;
  text('אֱלֹהִים', 620, 640, {f: 'Heb', size: 150, al: 'center', c: C.EL, a: n1}); text('Elohim · “God”', 620, 740, {f: 'Mono', size: 28, c: C.EL, al: 'center', a: n1});
  text('יהוה', 1300, 640, {f: 'Heb', size: 150, al: 'center', c: C.J, a: n2}); text('YHWH · Yahweh', 1300, 740, {f: 'Mono', size: 28, c: C.J, al: 'center', a: n2});
  // chart
  const ch = ss(ls('names', 2) - 0.2, ls('names', 2) + 0.6, t);
  if (ch > 0) { const x0 = 200, x1 = 1720, base = 470, bw = (x1 - x0) / 50, sy = 9;
    const grow = ss(ls('names', 2) + 0.4, ls('names', 2) + L('names', 2).d * 0.85, t);
    X.globalAlpha = A * ch; line(x0, base, x1, base, C.faint, 1.5);
    NAMES.forEach(([c, y, e], i) => { const u = Math.min(1, Math.max(0, grow * 50 - i));
      X.fillStyle = C.J; X.fillRect(x0 + i * bw + 3, base - y * sy * u, bw - 6, y * sy * u);
      X.fillStyle = C.EL; X.fillRect(x0 + i * bw + 3, base, bw - 6, e * sy * u);
      if (c % 5 === 0 || c === 1) text(String(c), x0 + i * bw + bw / 2, base + 20 + 2, {f: 'Mono', size: 15, c: C.dim, al: 'center', bl: 'top', a: 0.001 + 0}); });
    for (const c of [1, 10, 20, 30, 40, 50]) text(String(c), x0 + (c - 1) * bw + bw / 2, 820, {f: 'Mono', size: 20, c: C.dim, al: 'center'});
    text('GENESIS, CHAPTER', W / 2, 865, {f: 'Mono', size: 18, c: C.faint, al: 'center', ls: 3});
    text('↑ Yahweh  יהוה', x0, 230, {f: 'Heb', size: 40, c: C.J}); text('↓  Elohim  אֱלֹהִים', x0, 910 - 60, {f: 'Heb', size: 34, c: C.EL, a: 0});
    text('↓ Elohim  אֱלֹהִים', x1, 760, {f: 'Heb', size: 40, c: C.EL, al: 'right'});
    caption('Every occurrence of יהוה and אלהים in the Hebrew text of Genesis (Westminster Leningrad Codex), by chapter', ch);
    const seam = ss(ls('names', 3) + L('names', 3).d * 0.6, ls('names', 3) + L('names', 3).d * 0.6 + 0.8, t);
    if (seam > 0) { X.save(); X.shadowColor = C.J; X.shadowBlur = 25; line(x0 + bw, 170, x0 + bw, lerp(170, 800, seam), '#fff3d6', 3, A); X.restore();
      text('the seam: Genesis 1 | 2', x0 + bw + 16, 150, {f: 'CormI', size: 34, c: C.J, a: A * seam}); } }
  X.restore(); }

function sCreation(t) { const A = sa('creation', t); X.save(); X.globalAlpha = A;
  const h = ss(ls('creation', 0), ls('creation', 0) + 1, t), xl = 560, xr = 1360;
  text('Genesis 1', xl, 200, {f: 'Corm', size: 64, al: 'center', a: h}); text('God  ·  Elohim', xl, 250, {f: 'Mono', size: 24, c: C.EL, al: 'center', a: h, ls: 2});
  text('Genesis 2', xr, 200, {f: 'Corm', size: 64, al: 'center', a: h}); text('Yahweh God', xr, 250, {f: 'Mono', size: 24, c: C.J, al: 'center', a: h, ls: 2});
  line(W / 2, 170, W / 2, 900, C.faint, 1.5, h);
  const Lft = [['plants', 'day 3'], ['animals', 'days 5–6'], ['humans, male and female', 'day 6']], Rgt = [['a man, from the dust', ''], ['a garden', ''], ['animals', ''], ['a woman', '']];
  const ly = i => 370 + i * 150, ry = i => 350 + i * 118;
  const f1 = i => ss(ls('creation', 1) + L('creation', 1).d * (0.25 + i * 0.22), ls('creation', 1) + L('creation', 1).d * (0.25 + i * 0.22) + 0.6, t);
  const f2 = i => ss(ls('creation', 2) + L('creation', 2).d * (0.22 + i * 0.19), ls('creation', 2) + L('creation', 2).d * (0.22 + i * 0.19) + 0.6, t);
  Lft.forEach(([a, b], i) => { text(`${i + 1}`, xl - 280, ly(i), {f: 'Mono', size: 26, c: C.EL, a: f1(i)}); text(a, xl, ly(i), {f: 'Gar', size: 44, al: 'center', a: f1(i)}); text(b, xl, ly(i) + 38, {f: 'Mono', size: 20, c: C.dim, al: 'center', a: f1(i)}); });
  Rgt.forEach(([a], i) => { text(`${i + 1}`, xr - 280, ry(i), {f: 'Mono', size: 26, c: C.J, a: f2(i)}); text(a, xr, ry(i), {f: 'Gar', size: 44, al: 'center', a: f2(i)}); });
  const k = ss(ls('creation', 3), ls('creation', 3) + 1.5, t);
  if (k > 0) { const pairs = [[0, 1], [1, 2], [2, 0], [2, 3]];
    pairs.forEach(([a, b], i) => { const kk = ss(ls('creation', 3) + i * 0.35, ls('creation', 3) + i * 0.35 + 0.9, t);
      X.save(); X.globalAlpha = A * 0.8 * kk; X.strokeStyle = mix(C.EL, C.J, 0.5); X.lineWidth = 2; X.setLineDash([6, 8]); X.beginPath();
      X.moveTo(xl + 270, ly(a) - 14); X.bezierCurveTo(W / 2, ly(a) - 14, W / 2, ry(b) - 14, lerp(xl + 270, xr - 250, kk), lerp(ly(a), ry(b), kk) - 14); X.stroke(); X.restore(); }); }
  const q = ss(ls('creation', 3) + L('creation', 3).d * 0.45, ls('creation', 3) + L('creation', 3).d * 0.45 + 0.8, t), q2 = ss(ls('creation', 3) + L('creation', 3).d * 0.7, ls('creation', 3) + L('creation', 3).d * 0.7 + 0.8, t);
  para('“God said, ‘Let there be light,’ and there was light.”', xl, 900, 700, {f: 'GarI', size: 30, c: C.EL, a: q});
  para('“…formed man from the dust of the ground, and breathed into his nostrils the breath of life.”', xr, 900, 700, {f: 'GarI', size: 30, c: C.J, a: q2});
  text('1:3', xl, 1010, {f: 'Mono', size: 18, c: C.dim, al: 'center', a: q}); text('2:7', xr, 1010, {f: 'Mono', size: 18, c: C.dim, al: 'center', a: q2});
  X.restore(); }

function sDoublets(t) { const A = sa('doublets', t); X.save(); X.globalAlpha = A;
  const out = ss(ls('doublets', 2) - 0.5, ls('doublets', 2) + 0.3, t);
  const rows = [['A wife passed off as a sister', ['Gen 12', 'Gen 20', 'Gen 26']], ['Hagar in the wilderness', ['Gen 16', 'Gen 21']], ['Bethel is named', ['Gen 28', 'Gen 35']], ['Beersheba is named', ['Gen 21', 'Gen 26']]];
  const d1 = L('doublets', 1);

    text('layers, grown over time', 550, 750, {f: 'CormI', size: 32, c: C.dim, al: 'center'});
    SRC.forEach((s, i) => { const y = 400 + i * 80; const pts = []; for (let x = 1080; x <= 1660; x += 5) pts.push([x, y + 6 * Math.sin(x * 0.02 - t + i)]); strand(pts, s.c, 1, 5); text(s.k, 1060, y + 14, {f: 'Corm', size: 40, c: s.c, al: 'center'}); });
    text('continuous sources, traced by plot', 1370, 750, {f: 'CormI', size: 32, c: C.dim, al: 'center'});
    text('e.g. Joel Baden, Baruch Schwartz, Jeffrey Stackert', 1370, 840, {f: 'Mono', size: 19, c: C.faint, al: 'center'});
    const ag = ss(m(6) + md(6) * 0.5, m(6) + md(6) * 0.5 + 0.8, t);
    text('…and underneath, a lot of agreement', W / 2, 940, {f: 'CormI', size: 44, c: C.ink, al: 'center', a: ag});
    X.restore(); }
  X.restore(); }

function sConsensus(t) { const A = sa('consensus', t); X.save(); X.globalAlpha = A;
  text('WHAT ACADEMIC SCHOLARS LARGELY AGREE ON', W / 2, 190, {f: 'Mono', size: 24, c: C.dim, al: 'center', ls: 5, a: ss(ls('consensus', 0), ls('consensus', 0) + 0.8, t)});
  const items = [['The Torah is composite', 'many hands, over several centuries'], ['The Priestly material is identifiable', 'one of the most secure results in the field'], ['Deuteronomy is a distinct voice', 'its core tied to the 7th century BCE and Josiah’s reforms'], ['Final shape: the Persian period', 'roughly the 5th–4th century BCE']];
  items.forEach(([a, b], i) => { const at = ls('consensus', i), k = ss(at, at + 0.8, t), y = 320 + i * 150;
    X.save(); X.globalAlpha = A * k; X.strokeStyle = C.J; X.lineWidth = 5; X.lineCap = 'round'; X.beginPath(); const ck = ss(at + 0.3, at + 1, t);
    X.moveTo(470, y - 18); X.lineTo(lerp(470, 488, Math.min(1, ck * 2)), lerp(y - 18, y, Math.min(1, ck * 2))); if (ck > 0.5) X.lineTo(lerp(488, 522, (ck - 0.5) * 2), lerp(y, y - 40, (ck - 0.5) * 2)); X.stroke(); X.restore();
    text(a, 570, y, {f: 'Corm', size: 54, a: A * k}); text(b, 570, y + 42, {f: 'GarI', size: 30, c: C.dim, a: A * k}); });
  const d = ss(ls('consensus', 3) + L('consensus', 3).d * 0.6, ls('consensus', 3) + L('consensus', 3).d * 0.6 + 1, t);
  if (d > 0) { const y = 960, Y = yr => lerp(470, 1450, (700 - yr) / 700); line(Y(700), y, Y(0), y, C.faint, 2, d);
    X.globalAlpha = A * d; X.fillStyle = C.P + '55'; X.fillRect(Y(539), y - 14, Y(332) - Y(539), 28); text('Persian period', (Y(539) + Y(332)) / 2, y - 26, {f: 'Mono', size: 18, c: C.P, al: 'center', a: A * d});
    X.fillStyle = C.J; X.beginPath(); X.arc(Y(250), y, 12, 0, 7); X.fill(); text('oldest surviving Torah scrolls, c. 250 BCE', Y(250) - 16, y - 26, {f: 'Mono', size: 18, c: C.J, al: 'left', a: A * d});
    for (const yr of [700, 500, 300, 100]) text(`${yr} BCE`, Y(yr), y + 40, {f: 'Mono', size: 16, c: C.dim, al: 'center', a: A * d}); }
  X.restore(); }

function sClose(t) { const A = sa('close', t); X.save(); X.globalAlpha = A;
  const c0 = ls('close', 0), k1 = ls('close', 1), k2 = ls('close', 2), k3 = ls('close', 3);
  // two columns then braid back into one block
  const split = 1 - ss(k1 - 1.2, k1 + 0.4, t);
  const blk = 1 - ss(k2 + L('close', 2).d - 0.2, k2 + L('close', 2).d + 0.6, t);
  floodBlock(t, 1, split, blk * ss(c0, c0 + 1, t) * 0.9, []);
  const kb = ss(k1, k1 + 0.6, t) * (1 - ss(k2 - 0.2, k2 + 0.5, t));
  if (kb > 0) { X.fillStyle = `rgba(20,17,13,${0.72 * kb})`; X.fillRect(0, 0, W, H); text('They kept both.', W / 2, H / 2 + 30, {f: 'Corm', size: 120, al: 'center', a: kb}); }
  const k2a = ss(k2, k2 + 0.8, t) * (1 - ss(k3 - 0.4, k3 + 0.3, t));
  if (k2a > 0) { X.fillStyle = `rgba(20,17,13,${0.8 * k2a})`; X.fillRect(0, 0, W, H);
    ['Maybe out of reverence.', 'Maybe to hold two communities together.', 'We don’t know.'].forEach((s, i) => text(s, W / 2, 440 + i * 100, {f: 'CormI', size: 58, al: 'center', c: i === 2 ? C.dim : C.ink, a: ss(k2 + L('close', 2).d * [0, 0.3, 0.75][i], k2 + L('close', 2).d * [0, 0.3, 0.75][i] + 0.6, t)})); }
  const fin = ss(k3, k3 + 0.8, t);
  if (fin > 0) { threads(t, 0, W, 800, 26, fin * 0.85, 0);
    para('Not one voice.', W / 2, 400, 1500, {f: 'Corm', size: 90, a: fin});
    para('A conversation, kept on purpose.', W / 2, 540, 1500, {f: 'CormI', size: 70, c: C.J, a: ss(k3 + L('close', 3).d * 0.45, k3 + L('close', 3).d * 0.45 + 0.8, t)}); }
  X.restore(); }

function sEnd(t) { const w = sc('end'), A = ss(w.a, w.a + 1, t) * (1 - ss(w.b - 1.2, w.b, t)); X.save(); X.globalAlpha = A;
  threads(t, 0, W, 760, 18, 0.5, 0);
  text('Who Wrote the Torah?', W / 2, 400, {f: 'Corm', size: 96, al: 'center'});

  text('Scripture quotations: World English Bible (public domain). Hebrew counts: Westminster Leningrad Codex (OSHB).', W / 2, 590, {f: 'Mono', size: 19, c: C.dim, al: 'center'});
  text('Further reading in the description.', W / 2, 630, {f: 'Mono', size: 19, c: C.dim, al: 'center'});
  X.restore(); }

const ORDER = [['open', sOpen], ['title', sTitle], ['tradition', sTradition], ['names', sNames], ['creation', sCreation], ['doublets', sDoublets], ['flood', sFlood], ['sources', sSources], ['history', sHistory], ['modern', sModern], ['consensus', sConsensus], ['close', sClose], ['end', sEnd]];
window.render = function (t) { X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; background(t);
  for (const [k, f] of ORDER) if (on(k, t)) { X.save(); f(t); X.restore(); }
  X.globalAlpha = 1; finish(t); };
window.ready = (async () => { for (const f of ['Corm', 'CormI', 'Gar', 'GarI', 'Heb', 'Mono']) await document.fonts.load(`40px ${f}`, 'אab'); await document.fonts.ready; render(0); return {total: TL.total}; })();
